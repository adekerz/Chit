<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chit">
<meta name="theme-color" content="#14161A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Chit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14161A; --bg2:#1B1E24; --bg3:#22262E;
  --paper:#FBF7EC; --ink:#211D16; --ink-dim:#6B6455;
  --line:#2A2E36; --muted:#59626F; --fg:#E7E5DF;
  --free:#3A414D; --busy:#2F7B4F; --precheck:#8C5A1A; --alert:#A9352C; --new:#4451A6;
  --sans:'IBM Plex Sans',-apple-system,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);overscroll-behavior:none}
body{display:flex;flex-direction:column}
button,input,textarea,select{font-family:inherit}
.topbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0}
.topbar h1{margin:0;font-size:15px;font-weight:600;flex:1;letter-spacing:.01em}
.topbar h1#thead{cursor:pointer}
.topbar h1 .chev{color:var(--muted);font-size:11px;margin-left:-2px}
.topbar .sub{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.iconbtn{background:none;border:none;color:var(--fg);font-size:14px;padding:6px 8px;cursor:pointer;border-radius:4px}
.iconbtn:active{background:var(--bg3)}
.back{font-size:15px;color:var(--fg);background:none;border:none;padding:6px 4px 6px 0;cursor:pointer}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.bottom{flex-shrink:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line);display:flex;gap:8px}
.btn{flex:1;padding:14px;border:none;border-radius:5px;font-size:14.5px;font-weight:600;cursor:pointer;background:var(--fg);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.amber{background:var(--precheck);color:#fff}
.btn.green{background:var(--busy);color:#fff}
.btn:disabled{opacity:.35}
.hint{color:var(--muted);font-size:13px;line-height:1.6;text-align:center;padding:50px 24px}

/* floor grid */
.zone-title{font-size:12px;color:var(--muted);margin:14px 2px 8px;letter-spacing:.03em}
.zone-title:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tcell{aspect-ratio:1/.85;border-radius:6px;border:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;justify-content:space-between;padding:9px;cursor:pointer;position:relative;overflow:hidden}
.tcell .num{font-family:var(--mono);font-size:21px;font-weight:600;line-height:1}
.tcell .meta{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:flex-end}
.tcell.busy{background:rgba(47,123,79,.17);border-color:var(--busy)}
.tcell.busy .meta{color:#7FBF9A}
.tcell.precheck{background:rgba(140,90,26,.2);border-color:var(--precheck)}
.tcell.precheck .meta{color:#D2A05C}
.tcell.alert{background:rgba(169,53,44,.2);border-color:var(--alert)}
.tcell.alert .meta{color:#E0847C}
.badge{position:absolute;top:7px;right:7px;background:var(--new);color:#fff;font-family:var(--mono);font-size:10px;font-weight:600;border-radius:9px;padding:2px 6px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}

/* order screen */
.guesttabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:2px}
.gtab{flex-shrink:0;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);font-size:13px;cursor:pointer}
.gtab.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.gsec{margin-bottom:14px}
.gsec h3{font-size:12px;color:var(--muted);margin:0 0 6px 2px;font-weight:500;letter-spacing:.03em}
.item{background:var(--paper);color:var(--ink);border-radius:4px;border-left:4px solid var(--new);padding:10px 11px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start}
.item.punched{border-left-color:var(--busy)}
.item.late{border-left-color:var(--alert)}
.item.done{border-left-color:#B9B3A4;opacity:.65}
.item .body{flex:1;min-width:0;cursor:pointer}
.item .nm{font-size:14px;font-weight:500;line-height:1.3}
.item .det{font-size:12px;color:var(--ink-dim);margin-top:3px;line-height:1.45}
.item .det b{font-weight:600;color:#7A4A12}
.item .tmr{font-family:var(--mono);font-size:11px;margin-top:4px;color:var(--ink-dim)}
.item .tmr.late{color:var(--alert);font-weight:600}
.item.sent .nm{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--ink-dim)}
.item.sent:not(.late) .nm{color:var(--ink-dim)}
.qrow{display:flex;align-items:center;gap:6px;margin-top:8px}
.qbtn{width:34px;height:30px;border-radius:5px;border:1px solid #C9C2B0;background:transparent;color:var(--ink);font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.qbtn:active{background:#EFE9DA}
.qbtn.del{color:#A9352C;border-color:#DCC3BF;font-size:14px}
.qbtn.cmt{font-size:13px;margin-left:4px}
.qbtn.cmt.on{background:var(--ink);border-color:var(--ink)}
.item.flash{animation:flashrow 1.1s ease-out}
@keyframes flashrow{0%{box-shadow:0 0 0 3px rgba(68,81,166,.85)}100%{box-shadow:0 0 0 0 rgba(68,81,166,0)}}
@media (prefers-reduced-motion:reduce){.item.flash{animation:none}}
.qn{font-family:var(--mono);font-size:15px;font-weight:600;min-width:22px;text-align:center;color:var(--ink)}
.qsum{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--ink-dim)}
.flags{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.flag{width:34px;height:26px;border-radius:4px;border:1.5px solid #C9C2B0;background:transparent;color:var(--ink-dim);font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
.flag.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.flag:disabled{opacity:.3}
.sumline{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--muted);padding:10px 2px 4px;border-top:1px solid var(--line);margin-top:6px}
.sumline b{color:var(--fg);font-size:15px}
.sumline.nb{border-top:none;margin-top:0;padding-top:3px}

/* menu drawer: выезжает снизу поверх стола, не занимая весь экран —
   верх (список позиций стола) остаётся виден и живой */
.menudrawer{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--bg2);
  border-top:1px solid var(--line);border-radius:14px 14px 0 0;
  max-height:56vh;display:flex;flex-direction:column;
  box-shadow:0 -10px 30px rgba(0,0,0,.5);padding:8px 14px calc(10px + env(safe-area-inset-bottom))}
.md-handle{width:36px;height:4px;border-radius:3px;background:var(--line);margin:2px auto 10px}
.md-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:15px;font-weight:600}
.menudrawer .search{margin-bottom:8px;flex-shrink:0}
.md-list{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}

/* menu */
.search{width:100%;padding:12px 13px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;color:var(--fg);font-size:15px;margin-bottom:10px}
.search::placeholder{color:var(--muted)}
.searchwrap{position:relative;margin-bottom:10px}
.searchwrap .search{margin-bottom:0;padding-right:38px}
.searchclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:none;background:var(--bg3);color:var(--muted);font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.searchclear:active{background:var(--line)}
.cat{margin-bottom:8px}
.cat>.head{padding:13px 14px;background:var(--bg2);border-left:3px solid var(--fg);border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center;letter-spacing:.01em}
.cat>.head .chev{color:var(--muted);font-size:13px}
.subhead{padding:10px 12px;margin:7px 0 5px;background:var(--bg3);border-radius:5px;font-size:13px;font-weight:600;color:var(--fg);cursor:pointer;display:flex;justify-content:space-between;align-items:center;letter-spacing:.02em}
.subhead:active{background:var(--bg2)}
.subhead .chev{color:var(--muted);font-size:11px}
.sub{padding:2px 0 2px 2px}
.sub>h4{font-size:11.5px;color:var(--muted);margin:6px 2px 5px;font-weight:500;letter-spacing:.03em}
.dish{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.dish:active{background:var(--bg2)}
.dish .dn{flex:1;font-size:14px;line-height:1.3}
.dish .dp{font-family:var(--mono);font-size:13px;color:var(--muted)}
.dish .tag{font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;margin-left:6px;vertical-align:middle;display:inline-block}
.tag.stop{background:var(--alert);color:#fff}
.tag.go{background:var(--busy);color:#fff}
.tag.lim{background:var(--precheck);color:#fff;font-family:var(--mono)}
.tag.mod{background:var(--bg3);color:var(--muted)}
.tag.alg{background:#6E2A26;color:#F3C9C4}
.tag.alg.hit{background:var(--alert);color:#fff;box-shadow:0 0 0 1.5px #E0847C}
.dish.off{opacity:.34;pointer-events:none}
.crumb{font-size:11px;color:var(--muted);margin-top:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:65;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--bg2);border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet h2{margin:0 0 3px;font-size:17px;font-weight:600}
.sheet .sh-sub{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.field{margin-bottom:16px}
.field>label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
.field>label .req{color:var(--alert);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 14px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:13.5px;cursor:pointer}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.chip.sm{padding:7px 11px;font-size:12.5px}
.chips.qc{gap:5px;margin-bottom:8px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:20px;cursor:pointer}
.stepper .v{font-family:var(--mono);font-size:20px;font-weight:600;min-width:36px;text-align:center}
.sheet textarea,.sheet input[type=text],.sheet input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);font-size:15px;padding:11px;resize:none}
.sheet .acts{display:flex;gap:8px;margin-top:6px}
.rowbtn{width:100%;text-align:left;padding:14px 12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);font-size:14.5px;margin-bottom:7px;cursor:pointer}
.rowbtn.danger{color:#E0847C}
.alginfo{background:rgba(169,53,44,.14);border:1px solid var(--alert);color:#E0847C;border-radius:6px;padding:9px 11px;font-size:13px;line-height:1.45;margin-bottom:14px}
.warnbox{background:rgba(140,90,26,.16);border:1px solid var(--precheck);color:#D2A05C;border-radius:6px;padding:9px 11px;font-size:12.5px;line-height:1.5;margin-bottom:10px}
.okbox{background:rgba(47,123,79,.14);border:1px solid var(--busy);color:#7FBF9A;border-radius:6px;padding:9px 11px;font-size:12.5px;line-height:1.5;margin-bottom:10px}
.wineinfo{color:#C9A24A;font-size:13.5px;line-height:1.4;margin:-8px 0 14px;padding:2px}

/* settings / stop */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:14px;font-weight:600}
.card p{margin:0 0 11px;font-size:12.5px;color:var(--muted);line-height:1.55}
.card textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:5px;color:var(--fg);font-family:var(--mono);font-size:13px;padding:10px;resize:vertical;min-height:120px}
.smallbtn{padding:10px 14px;border-radius:5px;border:none;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;cursor:pointer}
.smallbtn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.stoprow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.stoprow .sn{flex:1;font-size:13.5px;line-height:1.3}
.stoprow .sc{font-size:11px;color:var(--muted)}
.wprice{font-family:var(--mono);font-size:13px;color:var(--fg);white-space:nowrap;align-self:center;font-weight:600}
.mini{padding:7px 10px;border-radius:5px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer}
.mini.stopon{background:var(--alert);border-color:var(--alert);color:#fff}
.mini.goon{background:var(--busy);border-color:var(--busy);color:#fff}
.limbox{width:52px;padding:7px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:13px;text-align:center}
.checkrow{display:flex;align-items:center;gap:11px;padding:13px 0;font-size:14.5px;cursor:pointer;border-bottom:1px solid var(--line)}
.checkrow input{width:21px;height:21px;accent-color:var(--busy)}

/* --- готовность --- */
.item .ct{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);border:1px solid #D6CFBD;border-radius:3px;padding:1px 4px;margin-left:6px;vertical-align:middle}
.item .tmr.ready{color:var(--alert);font-weight:600;letter-spacing:.02em}
.item.late{animation:pulseborder 1.6s ease-in-out infinite}
@keyframes pulseborder{0%,100%{border-left-color:var(--alert)}50%{border-left-color:#E0847C}}
@media (prefers-reduced-motion:reduce){.item.late{animation:none}}
.readybar{background:rgba(169,53,44,.16);border:1px solid var(--alert);border-radius:7px;padding:10px 12px;margin-bottom:14px}
.rb-h{font-size:12px;color:#E0847C;font-weight:600;letter-spacing:.03em;margin-bottom:7px}
.rb-row{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid rgba(169,53,44,.28);cursor:pointer}
.rb-row:first-of-type{border-top:none}
.rb-t{font-family:var(--mono);font-size:15px;font-weight:600;min-width:26px}
.rb-n{flex:1;font-size:13.5px;line-height:1.3}
.rb-w{font-family:var(--mono);font-size:12px;color:#E0847C}
.badge.rdy{background:var(--alert);font-size:9.5px}
.tag.time{background:var(--bg3);color:#9AA3B0;font-family:var(--mono)}
.chip-t{font-family:var(--mono);font-size:10.5px;opacity:.62;margin-left:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:22px;font-size:13.5px;font-weight:600;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.5);pointer-events:none;max-width:86vw;text-align:center}
.toast.overdrawer{bottom:calc(var(--drawer-h,0px) + 14px)}

/* --- подтверждение пробития: стол + что именно пробито --- */
.punchcard{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--bg2);border:1px solid var(--busy);border-radius:12px;padding:12px 16px;z-index:81;box-shadow:0 10px 30px rgba(0,0,0,.55);max-width:min(92vw,360px);max-height:40vh;overflow-y:auto;-webkit-overflow-scrolling:touch;cursor:pointer}
.punchcard .pc-h{position:sticky;top:-12px;background:var(--bg2);padding:12px 0 7px;margin:-12px 0 0;font-size:12.5px;font-weight:600;color:#7FBF9A;letter-spacing:.02em}
.punchcard .pc-row{display:flex;gap:8px;font-size:13.5px;color:var(--fg);padding:3px 0;text-decoration:line-through;text-decoration-color:var(--muted);opacity:.82}
.punchcard .pc-q{font-family:var(--mono);color:var(--muted);flex-shrink:0}

/* --- пейринг вина к блюду --- */
.winetag{background:none;border:none;color:#D8B463;font-size:15px;padding:4px 6px;cursor:pointer;flex-shrink:0}
.flag.wine{border-color:#8C6A2A;color:#D8B463}
.winemore{color:#D8B463;text-decoration:underline;cursor:pointer;font-size:12.5px}
.pair-block{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:9px}
.pair-label{font-size:10.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;font-weight:600}
.pair-name{font-size:14px;font-weight:600;color:#D8B463;margin-bottom:4px}
.pair-why{font-size:12.5px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<main id="main"></main>
<div class="bottom" id="bottom"></div>

<script>
/* ---------- storage adapter: works both in Claude artifacts and on a real host ---------- */
const store = {
  async get(k){
    try{
      if(window.storage){ const r = await window.storage.get(k,false); return r ? r.value : null; }
    }catch(e){ return null; }
    try{ return localStorage.getItem(k); }catch(e){ return null; }
  },
  async set(k,v){
    try{
      if(window.storage){ await window.storage.set(k,v,false); return; }
    }catch(e){}
    try{ localStorage.setItem(k,v); }catch(e){}
  }
};

/* ---------- menu parsing ---------- */
function slug(s){ return s.toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'-'); }
function parseMenu(text){
  const cats=[], dishes=[]; let cat=null, sub=null;
  text.split('\n').forEach(raw=>{
    const line=raw.trim();
    if(!line||line.startsWith('//')) return;
    if(line.startsWith('## ')){
      if(!cat){cat={name:'Меню',subs:[]};cats.push(cat);}
      sub={name:line.slice(3).trim(),dishes:[]}; cat.subs.push(sub); return;
    }
    if(line.startsWith('# ')){
      cat={name:line.slice(2).trim(),subs:[]}; cats.push(cat); sub=null; return;
    }
    const parts=line.split('|').map(p=>p.trim());
    const name=parts[0]; if(!name) return;
    const price=parts[1]?parseInt(parts[1].replace(/\D/g,''),10)||0:0;
    const mods=[]; let cook=null, allergens=[], wine=null;
    for(let i=2;i<parts.length;i++){
      let p=parts[i]; if(!p) continue;
      if(p.startsWith('~')){ cook=parseFloat(p.slice(1).replace(',','.'))||null; continue; }
      if(p.startsWith('@')){ allergens=p.slice(1).split(',').map(a=>a.trim()).filter(Boolean); continue; }
      if(p.startsWith('$')){ wine=p.slice(1).trim()||null; continue; }
      let required=false;
      if(p.startsWith('!')){required=true;p=p.slice(1);}
      else if(p.startsWith('?')){p=p.slice(1);}
      const ci=p.indexOf(':'); if(ci<0) continue;
      const gname=p.slice(0,ci).trim();
      // вариант: label[~время[~цена]] — время и цена опциональны и переопределяют базовые
      const opts=p.slice(ci+1).split(',').map(o=>{
        const t=o.trim(); if(!t) return null;
        const seg=t.split('~');
        const label=seg[0].trim(); if(!label) return null;
        const oCook = seg.length>1 ? (parseFloat((seg[1]||'').replace(',','.'))||null) : null;
        const oPrice = seg.length>2 ? (parseInt((seg[2]||'').replace(/\D/g,''),10)||null) : null;
        return {label, cook:oCook, price:oPrice};
      }).filter(Boolean);
      if(gname&&opts.length) mods.push({name:gname,required,options:opts});
    }
    if(!cat){cat={name:'Меню',subs:[]};cats.push(cat);}
    if(!sub){sub={name:'',dishes:[]};cat.subs.push(sub);}
    const d={id:slug(name),name,price,mods,cook,allergens,wine,cat:cat.name,sub:sub.name};
    sub.dishes.push(d); dishes.push(d);
  });
  return {cats,dishes};
}
function parseTables(text){
  const zones=[];
  text.split('\n').forEach(raw=>{
    const line=raw.trim(); if(!line) return;
    const ci=line.indexOf(':');
    const zname = ci>=0 ? line.slice(0,ci).trim() : '';
    const nums = (ci>=0?line.slice(ci+1):line).split(',').map(n=>n.trim()).filter(Boolean);
    if(nums.length) zones.push({name:zname,tables:nums});
  });
  return zones;
}
function parseWine(text){
  const out=[]; let cat='', country='';
  text.split(String.fromCharCode(10)).forEach(raw=>{
    const line=raw.trim(); if(!line) return;
    if(line.startsWith('## ')){ country=line.slice(3).trim(); return; }
    if(line.startsWith('# ')){ cat=line.slice(2).trim(); country=''; return; }
    const p=line.split('|').map(x=>x.trim());
    if(!p[0]) return;
    out.push({name:p[0], price:parseInt((p[1]||'').replace(/\D/g,''),10)||0, meta:p[2]||'', cat, country});
  });
  return out;
}
// пейринг блюдо → вино: # блюдо, ~ по бокалам, * бутылочный вариант (можно 0-2); после | — «почему»
function parsePairings(text){
  const out={}; let cur=null;
  text.split('\n').forEach(raw=>{
    const line=raw.trim(); if(!line) return;
    if(line.startsWith('# ')){
      cur=slug(line.slice(2).trim());
      out[cur]={glass:null,bottles:[]};
      return;
    }
    if(!cur) return;
    if(line.startsWith('~')||line.startsWith('*')){
      const body=line.slice(1);
      const pi=body.indexOf('|');
      const name=(pi<0?body:body.slice(0,pi)).trim();
      const why=(pi<0?'':body.slice(pi+1)).trim();
      if(!name) return;
      if(line.startsWith('~')) out[cur].glass={name,why};
      else out[cur].bottles.push({name,why});
    }
  });
  return out;
}
function pairingFor(dish){ return dish ? pairings[dish.id] : null; }

/* ---------- поиск ----------
   Транслитерация нужна, чтобы «авион» находил Avion: половина барной карты на
   латинице, а набирать её на русской раскладке быстрее, чем переключаться.
   Ранжирование нужно из-за подпоследовательности («кпч» → капучино): она очень
   полезна, но без приоритета на «авион» вылезал «Бефстроганов из говядины»
   (а-в-и-о-н нашлись вразброс). Теперь подпоследовательность идёт последней и
   прячется, если есть нормальные совпадения. */
const DIA={'ä':'a','á':'a','à':'a','â':'a','å':'a','ã':'a','ö':'o','ó':'o','ò':'o','ô':'o','ø':'o','õ':'o','ü':'u','ú':'u','ù':'u','û':'u','é':'e','è':'e','ê':'e','ë':'e','í':'i','ì':'i','î':'i','ï':'i','ñ':'n','ç':'c','ý':'y','ß':'ss'};
function fold(s){ return (s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9\s]/g,ch=>DIA[ch]!==undefined?DIA[ch]:' '); }
const RU2LAT={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ж:'zh',з:'z',и:'i',й:'i',к:'k',л:'l',м:'m',н:'n',о:'o',
  п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sh',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
function translit(s){
  return (s||'').toLowerCase().replace(/ё/g,'е').replace(/дж/g,'j')
    .replace(/[а-я]/g,c=>RU2LAT[c]!==undefined?RU2LAT[c]:c);
}
/* фонетический скелет: «бифитер» и Beefeater, «ягер» и Jägermeister должны сойтись.
   Транслитерация в лоб этого не даёт — русские пишут на слух, а не по буквам */
function phon(s){
  return translit(fold(s)).replace(/[^a-z]/g,'')
    .replace(/ck/g,'k').replace(/ph/g,'f').replace(/th/g,'t')
    .replace(/ee|ea/g,'i').replace(/oo|ou/g,'u')
    .replace(/j/g,'y').replace(/c/g,'k').replace(/x/g,'ks').replace(/w/g,'v').replace(/q/g,'k')
    .replace(/(.)\1+/g,'$1');
}
/* допуск для ПОИСКА рукой: мягче, чем в разборе стоп-листа (там цена ошибки —
   неверная информация гостю, а здесь максимум лишняя строка в выдаче) */
function nearPhon(a,b){
  if(a===b) return true;
  if(a.length>=4&&b.startsWith(a)) return true;
  const m=Math.max(a.length,b.length), d=m>=9?3:(m>6?2:1);
  return Math.abs(a.length-b.length)<=d && lev(a,b)<=d;
}
const _phonCache=new Map();
function phonWords(s){
  let v=_phonCache.get(s);
  if(!v){ v=(s||'').split(/\s+/).map(phon).filter(Boolean); _phonCache.set(s,v); }
  return v;
}
// насколько «кучно» лежит подпоследовательность: «кпч» в «капучино» плотнее,
// чем в «паштете из куриной печени» — значит и в списке должно быть выше
function subseqSpan(n,s){
  let i=0, start=-1;
  for(let k=0;k<n.length;k++){
    if(n[k]===s[i]){ if(i===0) start=k; i++; if(i===s.length) return k-start+1; }
  }
  return -1;
}
function searchScore(name,q){
  const n=(name||'').toLowerCase().replace(/ё/g,'е');
  const s=(q||'').toLowerCase().replace(/ё/g,'е').trim();
  if(!s) return 1;
  if(n.startsWith(s)) return 100;
  if(n.includes(s)) return 90;
  const words=s.split(/\s+/).filter(Boolean);
  if(words.length>1&&words.every(w=>n.includes(w))) return 80;
  const tn=translit(n), ts=translit(s);
  if(tn.startsWith(ts)) return 70;
  if(tn.includes(ts)) return 65;
  if(words.length>1&&words.every(w=>tn.includes(translit(w)))) return 60;
  const pq=phonWords(s), pn=phonWords(n);
  if(pq.length&&pq.every(w=>pn.some(x=>x===w||(w.length>=3&&x.startsWith(w))||(w.length>=3&&nearPhon(w,x))))) return 45;
  const span=subseqSpan(n,s);
  if(span>0) return 20+Math.max(0,10-Math.round(span/Math.max(1,s.length)));
  const tspan=subseqSpan(tn,ts);
  if(tspan>0) return 10+Math.max(0,5-Math.round(tspan/Math.max(1,ts.length)));
  return 0;
}
const SEARCH_GOOD=60;   // «нормальное» совпадение: с него отсекаем подпоследовательность
function rankDishes(dishes,q){
  const out=[];
  dishes.forEach(d=>{
    const sc=searchScore(d.name,q);
    const alg=sc?0:(matchesAllergen(d,q)?40:0);
    if(sc||alg) out.push({d, sc:Math.max(sc,alg), alg:!sc&&!!alg});
  });
  out.sort((a,b)=>b.sc-a.sc);
  const best=out.length?out[0].sc:0;
  return best>=SEARCH_GOOD ? out.filter(x=>x.sc>=40) : out;
}
function textMatch(n,q){ return searchScore(n,q)>0; }
function matches(name,q){ return textMatch(name,q); }
function matchesAllergen(dish,q){
  if(!q||!q.trim()) return false;
  return (dish.allergens||[]).some(a=>textMatch(a,q));
}

/* ---------- разбор стоп-листа / ограничений / гоу, вставленных текстом ----------
   Сообщение из рабочей группы приходит примерно так:
     КУХНЯ ОГРАНИЧЕНИЕ: 🛑        ← секция: дальше лимиты
     Щеки с пюре 6 порций          ← лимит 6
     СТОП ЛИСТ БАР ❌              ← секция: дальше стопы
     Вина:                         ← группа: дальше ищем в винной карте
     Pertois moriset
     Текила:                       ← группа: дальше ищем внутри подкатегории «Текила»
     Azul
     Пиво разливное: все           ← вся подкатегория
     Все авторские коктейли        ← вся подкатегория
     Beefeater весь                ← все позиции с этим словом в названии

   Строгое совпадение — только по границам слов (hasWords), НЕ через textMatch:
   нечёткая подпоследовательность хороша для поиска блюда рукой, но здесь ценой
   ошибки будет неверная информация гостю («мск» не должно вставать стопом на
   «Масала»). Опечатки ловит отдельный слой findNear, и его догадки не
   применяются молча — официант подтверждает их тапом. */
function normName(s){ return fold(s).replace(/[^a-zа-я0-9]+/g,' ').trim(); }
// в JS \b и \w не понимают кириллицу, поэтому границы слов ловим пробелами
function hasWords(hay,needle){ return (' '+hay+' ').includes(' '+needle+' '); }
function stemW(w){ return w.length>4?w.slice(0,4):w; }   // «лимонады»/«лимонад», «ликёры»/«ликер»
const STOP_NOISE=/^(всем\s+)?(привет[а-яё]*|здравствуйте|добр(ое|ый|ой)\s+[а-яё]+|на\s+сегодня|сегодня|стоп|стоп[\s-]*лист|кухня|бар|важно|upd|апдейт|обновление|update)$/i;
const EMOJI=/[\u{1F000}-\u{1FAFF}\u{2190}-\u{27BF}\u{FE0F}\u{2022}]/gu;

function splitQty(s){
  let qty=null;
  // единица обязательна: иначе «Ballantine's 17» превратилось бы в лимит 17
  s=s.replace(/\s*\(?\s*(?:осталось|остаток|ост\.?)\s*(\d{1,3})\s*(?:шт\.?|порц[а-яё]*|пор)?\s*\)?\s*$/i,(m,n)=>{qty=+n;return '';});
  if(qty===null) s=s.replace(/\s*[—–(-]?\s*(\d{1,3})\s*(?:шт\.?|штук[а-яё]*|порц[а-яё]*|пор)\.?\)?\s*$/i,(m,n)=>{qty=+n;return '';});
  return {qty,text:s.trim()};
}
function cleanStopLine(raw){
  let s=(raw||'').replace(EMOJI,' ')
    .replace(/^[\s\-–—*·>+.]+/,'')          // маркеры списка
    .replace(/^\d+[.)]\s*/,'')              // «1. » / «1) »
    .trim();
  s=s.replace(/^стоп[\s-]*лист(?![а-яё])[\s:—–-]*/i,'').replace(/^стоп(?![а-яё])[\s:—–-]+/i,'');
  s=s.replace(/\s*[—–-]\s*(нет|закончил(ся|ась|ось|ись)|стоп|отсутствует)\s*$/i,'');
  return s.replace(/[.,;:!]+$/,'').trim();
}

/* строгий поиск по пулу позиций (блюда меню или бутылки винной карты) */
function findBest(pool,txt){
  const q=normName(txt);
  if(!q) return {score:0,items:[]};
  let best=0, hits=[];
  pool.forEach(it=>{
    const n=it._n||(it._n=normName(it.name));
    let sc=0;
    if(n===q) sc=100;
    else if(hasWords(n,q)) sc=80;        // «Дорадо» → «Дорадо целиком на хоспере»
    else if(hasWords(q,n)) sc=70;        // «Рибай стейк» → «Рибай»
    else {
      const words=q.split(' ').filter(w=>w.length>2);
      if(words.length&&words.every(w=>hasWords(n,w))) sc=60;
      else {
        // «Авион» написали кириллицей, а в меню латиница
        const tn=it._tr||(it._tr=translit(n)), tq=translit(q);
        if(tn===tq||hasWords(tn,tq)||hasWords(tq,tn)) sc=58;
      }
    }
    if(!sc) return;
    if(sc>best){ best=sc; hits=[it]; } else if(sc===best) hits.push(it);
  });
  return {score:best,items:hits};
}

/* поиск с опечатками: «Chateu saint Robert cuvee» → «Chateau Saint-Robert Cuvee …» */
function lev(a,b){
  if(a===b) return 0;
  const m=a.length,n=b.length;
  if(!m||!n) return m||n;
  let prev=Array.from({length:n+1},(_,i)=>i), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    const t=prev; prev=cur; cur=t;
  }
  return prev[n];
}
function tokenNear(a,b){
  if(a===b) return true;
  // оба конца от 4 букв: иначе «h» из «G.H.Mumm» совпадёт с «humidor»
  if(Math.min(a.length,b.length)>=4&&(b.startsWith(a)||a.startsWith(b))) return true;
  const d=Math.max(a.length,b.length)>6?2:1;
  return Math.abs(a.length-b.length)<=d && lev(a,b)<=d;
}
function findNear(pool,txt){
  // короткие слова тоже считаем: «El humidor» → «El Jimador» держится именно на «el»
  // (humidor/jimador отличаются на три буквы — для опечатки слишком много)
  const qt=normName(txt).split(' ').filter(w=>w.length>=2);
  if(!qt.length) return {score:0,items:[]};
  let best=0, hits=[];
  pool.forEach(it=>{
    const nt=it._t||(it._t=normName(it.name).split(' ').filter(Boolean));
    let hit=0;
    qt.forEach(q=>{ if(nt.some(n=>tokenNear(q,n))) hit++; });
    const sc=hit/qt.length;
    // 0.5 — половина слов строки: «Щеки с пюре» → «Говяжьи щёки» / «Картофельное пюре».
    // Сам не выбираю, показываю оба варианта — официант тапает нужный
    if(sc<0.5) return;
    if(sc>best+0.001){ best=sc; hits=[it]; } else if(Math.abs(sc-best)<0.001) hits.push(it);
  });
  return {score:best,items:hits};
}

/* последний слой: «Авион» вместо Avion, «Бифитер» вместо Beefeater — русскими
   буквами на слух. Транслитерация (65+) достаточно надёжна, чтобы применить
   сразу; фонетика (45) — только через подтверждение */
function findPhon(pool,txt){
  let best=0, hits=[];
  pool.forEach(it=>{
    const sc=searchScore(it.name,txt);
    if(sc<45) return;
    if(sc>best){ best=sc; hits=[it]; } else if(sc===best) hits.push(it);
  });
  return {score:best,items:hits};
}

/* «Текила:», «Пиво разливное», «Кухня» → подкатегории меню */
function findSubs(txt){
  const q=normName(txt).split(' ').filter(Boolean).map(stemW);
  if(!q.length) return [];
  const out=[];
  menu.cats.forEach(c=>c.subs.forEach(s=>{
    if(!s.name) return;
    const nw=normName(c.name+' '+s.name).split(' ').filter(Boolean).map(stemW);
    if(q.every(w=>nw.includes(w))) out.push(s);
  }));
  return out;
}
function isWineWord(txt){ return /^вин[аоы]?$/i.test(normName(txt)); }

/* заголовок секции: меняет режим (стоп / гоу / лимиты) на все строки ниже.
   «Рибай — стоп» заголовком не считается: после вычитания служебных слов
   остаётся название блюда, а не «кухня»/«бар». */
function detectSection(raw){
  const h=(raw||'').replace(EMOJI,' ').trim();
  if(!/(стоп|гоу|ограничен[а-яё]*|лимит[а-яё]*|^go\b)/i.test(h)) return null;
  let mode=null;
  if(/ограничен|лимит/i.test(h)) mode='limit';
  else if(/гоу|^go\b/i.test(h)) mode='go';
  else if(/стоп/i.test(h)) mode='stop';
  if(!mode) return null;
  const rest=normName(h.replace(/стоп|лист|гоу|go|ограничен[а-яё]*|лимит[а-яё]*|на сегодня|сегодня/gi,''));
  if(rest&&!/^(кухня|кухни|бар|бара|зал)$/.test(rest)) return null;
  return {mode,area:rest||null};
}
/* «все авторские коктейли», «Пиво разливное: все», «Beefeater весь» */
function detectAll(line){
  let m=line.match(/^(?:вс[её]|весь|вся)\s+(.+)$/i);
  if(m) return m[1].trim();
  m=line.match(/^(.+?)\s*[:—–-]?\s*(?:вс[её]|весь|вся)$/i);
  if(m) return m[1].trim();
  return null;
}

function parseStopText(text){
  const dishPool=menu.dishes.map(d=>({kind:'dish',id:d.id,name:d.name,sub:d.sub,cat:d.cat}));
  const winePool=wines.map(w=>({kind:'wine',id:slug(w.name),name:w.name,sub:w.cat,cat:'Вино'}));
  const byId={};
  dishPool.forEach(it=>byId['dish:'+it.id]=it);
  const out={actions:[],suggest:[],choose:[],unknown:[],notes:[]};
  const reg={};
  function put(list,rec){
    const k=rec.target.kind+':'+rec.target.id;
    const prev=reg[k];
    if(prev){
      if(rec.limit!=null) prev.limit=rec.limit;
      if(rec.go){ prev.go=true; prev.stop=false; }
      else if(rec.stop&&!prev.go) prev.stop=true;
      return;
    }
    reg[k]=rec; list.push(rec);
  }
  const mk=(line,target,qty,mode,near)=>({
    line, target, near:!!near,
    limit: qty!=null?qty:null,
    go: mode==='go',
    stop: qty==null && mode!=='go'
  });

  let mode='stop', scope=null;
  (text||'').split('\n').forEach(raw=>{
    const sect=detectSection(raw);
    if(sect){
      mode=sect.mode;
      const subs=sect.area?findSubs(sect.area):[];
      scope=subs.length?{kind:'dish',subs}:null;
      return;
    }
    const rawTrim=(raw||'').replace(EMOJI,' ').trim();
    const isHeaderLike=/[:：]\s*$/.test(rawTrim);
    const q=splitQty(cleanStopLine(raw));
    const line=q.text;
    if(!line||!/[a-zа-яё]/i.test(line)) return;
    if(STOP_NOISE.test(line)) return;

    // групповая строка «все …»
    const allTxt=detectAll(line);
    if(allTxt){
      const subs=findSubs(allTxt);
      let items=[];
      if(subs.length) subs.forEach(s=>s.dishes.forEach(d=>items.push(byId['dish:'+d.id])));
      else if(isWineWord(allTxt)) items=winePool.slice();
      else {
        const nq=normName(allTxt);
        const src=scopePool()||dishPool;
        items=src.filter(it=>hasWords(it._n||(it._n=normName(it.name)),nq));
      }
      if(items.length){
        items.forEach(it=>put(out.actions,mk(line,it,q.qty,mode)));
        out.notes.push({line,count:items.length});
        return;
      }
      // «Бифитер весь» — написано на слух: показываем кандидатов, отмечает официант.
      // Область снова только подсказка: в списке группа могла быть указана неточно
      const sp0=scopePool();
      let ph=sp0&&sp0.length?findPhon(sp0,allTxt):{score:0,items:[]};
      if(!ph.items.length) ph=findPhon(dishPool.concat(winePool),allTxt);
      if(ph.items.length) out.choose.push({line,items:ph.items.slice(0,6),qty:q.qty,mode});
      else out.unknown.push(line);
      return;
    }
    // заголовок группы: «Вина:», «Текила:», «Пиво бутылочное:»
    if(isHeaderLike){
      if(isWineWord(line)){ scope={kind:'wine'}; return; }
      const subs=findSubs(line);
      // незнакомый заголовок всё равно сбрасывает область: следующие строки уже
      // из другой группы, искать их в предыдущей («Текила») — хуже, чем по всему меню
      scope=subs.length?{kind:'dish',subs}:null;
      return;
    }

    function scopePool(){
      if(!scope) return null;
      if(scope.kind==='wine') return winePool;
      const ids={}; scope.subs.forEach(s=>s.dishes.forEach(d=>ids[d.id]=1));
      return dishPool.filter(it=>ids[it.id]);
    }
    function resolve(txt){
      const sp=scopePool();
      if(sp){
        const inScope=findBest(sp,txt);
        if(inScope.score>=60) return inScope;
      }
      const all=scope&&scope.kind==='wine'?winePool:dishPool.concat(winePool);
      return findBest(all,txt);
    }
    const take=txt=>{
      const res=resolve(txt);
      if(res.score>=60&&res.items.length===1){ put(out.actions,mk(txt,res.items[0],q.qty,mode)); return; }
      if(res.score>=60){ out.choose.push({line:txt,items:res.items.slice(0,4),qty:q.qty,mode}); return; }
      // область (заголовок «Ликёры:») — это подсказка, а не ограничение: Jägermeister
      // лежит в другой подкатегории, но в стоп-листе написан под «Ликер:»
      const sp=scopePool();
      let near=sp&&sp.length?findNear(sp,txt):{score:0,items:[]};
      if(!near.items.length) near=findNear(dishPool.concat(winePool),txt);
      if(near.items.length===1){
        const rec=mk(txt,near.items[0],q.qty,mode,true);
        if(near.score>0.999) put(out.actions,rec);   // все слова совпали с точностью до опечатки
        else out.suggest.push(rec);                  // частично — только по подтверждению
        return;
      }
      if(near.items.length>1){ out.choose.push({line:txt,items:near.items.slice(0,6),qty:q.qty,mode}); return; }
      // русскими буквами про латиницу: «Авион» → Avion, «Бифитер» → Beefeater
      const ph=findPhon(scope&&scope.kind==='wine'?winePool:dishPool.concat(winePool),txt);
      if(ph.items.length===1){
        const rec=mk(txt,ph.items[0],q.qty,mode,true);
        if(ph.score>=65) put(out.actions,rec);   // транслитерация однозначна
        else out.suggest.push(rec);              // фонетика — только по подтверждению
        return;
      }
      if(ph.items.length>1){ out.choose.push({line:txt,items:ph.items.slice(0,6),qty:q.qty,mode}); return; }
      out.unknown.push(txt);
    };

    const whole=resolve(line);
    // строгое совпадение целой строкой выигрывает: в названиях есть запятые
    // («Томаты ким чи, кунжут ким чи») — такую строку резать нельзя
    if(whole.score>=80&&whole.items.length===1){ put(out.actions,mk(line,whole.items[0],q.qty,mode)); return; }
    // «Текила» без двоеточия — тоже заголовок группы, если совпала с подкатегорией
    // и при этом ни одно блюдо так не называется
    if(whole.score<60){
      if(isWineWord(line)){ scope={kind:'wine'}; return; }
      const subs=findSubs(line);
      if(subs.length){ scope={kind:'dish',subs}; return; }
    }
    const parts=line.split(/[,;]|\s+и\s+|\s*\/\s*/).map(p=>cleanStopLine(p)).filter(p=>p&&/[a-zа-яё]/i.test(p));
    if(parts.length>1){ parts.forEach(take); return; }
    take(line);
  });
  return out;
}

/* ---------- helpers ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function order(t){ return S.orders[t]; }
function usedCount(dishId){
  let n=0;
  Object.values(S.orders).forEach(o=>o.items.forEach(i=>{ if(i.dishId===dishId) n+=i.qty; }));
  return n;
}
function remaining(dishId){
  const lim=S.limits[dishId];
  if(lim===undefined||lim===null||lim==='') return null;
  return lim - usedCount(dishId);
}
function dishAvailable(d){
  if(S.stop[d.id]) return false;
  const r=remaining(d.id);
  return !(r!==null && r<=0);
}
function money(n){ return n.toLocaleString('ru-RU'); }
function mmss(ms){
  const s=Math.max(0,Math.floor(ms/1000)), m=Math.floor(s/60);
  if(m<60) return m+':'+String(s%60).padStart(2,'0');
  return Math.floor(m/60)+' ч '+(m%60)+' м';
}
function orderStatus(o){
  if(!o) return 'free';
  const now=Date.now();
  const ready=o.items.some(i=>isReady(i));
  if(ready) return 'alert';
  const late=o.items.some(i=>i.punchedAt&&!i.cook&&!i.delivered&&(now-i.punchedAt)>S.lateMin*60000);
  if(late) return 'alert';
  if(o.status==='precheck') return 'precheck';
  return 'busy';
}
function readyCount(o){ return o?o.items.filter(i=>isReady(i)).length:0; }
function unpunched(o){ return o?o.items.filter(i=>!i.punchedAt).reduce((a,i)=>a+i.qty,0):0; }
function subtotal(o){ return o?o.items.reduce((a,i)=>a+i.price*i.qty,0):0; }
function serviceAmount(o){ return o?Math.round(subtotal(o)*(S.serviceFee||0)/100):0; }
function total(o){ return subtotal(o)+serviceAmount(o); }

/* ---------- cook time ---------- */
function cookMinutes(dish, sel){
  let best = dish.cook;
  (dish.mods||[]).forEach(g=>{
    const chosen = sel && sel[g.name];
    if(!chosen) return;
    const opt = g.options.find(o=>o.label===chosen);
    if(opt && opt.cook!=null) best = opt.cook;   // прожарка переопределяет базовое время
  });
  if(best==null && S.defaultCook>0) best = S.defaultCook;
  return best;
}
function dishPrice(dish, sel){
  let best = dish.price;
  (dish.mods||[]).forEach(g=>{
    const chosen = sel && sel[g.name];
    if(!chosen) return;
    const opt = g.options.find(o=>o.label===chosen);
    if(opt && opt.price!=null) best = opt.price;  // вариант объёма/размера переопределяет цену
  });
  return best;
}
function readyAt(i){ return (i.punchedAt && i.cook) ? i.punchedAt + i.cook*60000 : null; }
function isReady(i){ const r=readyAt(i); return !!(r && !i.delivered && Date.now()>=r); }
function readyItems(){
  const out=[];
  Object.values(S.orders).forEach(o=>o.items.forEach(i=>{ if(isReady(i)) out.push({o,i,at:readyAt(i)}); }));
  return out.sort((a,b)=>a.at-b.at);
}

/* ---------- alerts: звук + вибро + системное уведомление ---------- */
let audioCtx=null;
function unlockAudio(){
  if(audioCtx) { if(audioCtx.state==='suspended') audioCtx.resume(); return; }
  try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
document.addEventListener('touchstart', unlockAudio, {once:false});
document.addEventListener('click', unlockAudio, {once:false});

function beep(){
  if(!S.sound || !audioCtx) return;
  try{
    if(audioCtx.state==='suspended') audioCtx.resume();
    const now=audioCtx.currentTime;
    [0,0.18].forEach((off,k)=>{
      const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
      osc.type='sine'; osc.frequency.value = k? 1046 : 784;
      g.gain.setValueAtTime(0,now+off);
      g.gain.linearRampToValueAtTime(0.32,now+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,now+off+0.16);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(now+off); osc.stop(now+off+0.18);
    });
  }catch(e){}
}
function notify(title, body){
  try{ if(navigator.vibrate) navigator.vibrate([120,60,120]); }catch(e){}
  beep();
  try{
    if('Notification' in window && Notification.permission==='granted'){
      new Notification(title,{body,tag:'floor-'+Date.now(),icon:'icon-192.png'});
    }
  }catch(e){}
}

/* проверка готовности: помечает и оповещает один раз на позицию */
function checkReady(){
  let changed=false, fresh=[];
  Object.values(S.orders).forEach(o=>o.items.forEach(i=>{
    if(i.notified||i.delivered) return;
    const r=readyAt(i);
    if(r && Date.now()>=r){ i.notified=true; changed=true; fresh.push({o,i}); }
  }));
  if(fresh.length){
    save();
    if(fresh.length===1){
      const f=fresh[0];
      notify('Готово · стол '+f.o.table, f.i.name+' — забрать');
    } else {
      notify('Готово: '+fresh.length+' поз.', fresh.map(f=>'ст.'+f.o.table+' '+f.i.name).join(', '));
    }
  }
  return changed;
}

/* ---------- persistence ---------- */
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    store.set('floor-v2',JSON.stringify({
      menuText:S.menuText,tablesText:S.tablesText,orders:S.orders,
      stop:S.stop,go:S.go,limits:S.limits,wstop:S.wstop,lateMin:S.lateMin,serviceFee:S.serviceFee,sound:S.sound,defaultCook:S.defaultCook
    }));
  },250);
}
async function boot(){
  const raw=await store.get('floor-v2');
  if(raw){ try{ Object.assign(S,JSON.parse(raw)); }catch(e){} }
  menu=parseMenu(S.menuText);
  wines=parseWine(WINE_CARD);
  pairings=parsePairings(PAIRING_TEXT);
  render();
}

/* ---------- toast ---------- */
let toastT=null;
function toast(msg){
  S.toast=msg; render();
  clearTimeout(toastT);
  toastT=setTimeout(()=>{S.toast=null;render();},1400);
}

/* ---------- actions ---------- */
function openTable(num,guests){
  S.orders[num]={table:num,guests,items:[],openedAt:Date.now(),status:'open',
    checks:{precheck:false,paid:false,cleared:false}};
  S.activeTable=num; S.activeGuest=1; S.screen='table'; S.sheet=null; S.menuOpen=false; save(); render();
}
function addItem(d,guest,qty,mods,comment){
  const o=order(S.activeTable); if(!o) return;
  const it={id:uid(),dishId:d.id,name:d.name,price:dishPrice(d,mods||{}),qty,guest,mods:mods||{},
    comment:comment||'',punchedAt:null,delivered:false,
    cook:cookMinutes(d,mods||{}),notified:false};
  o.items.push(it);
  S.scrollTo=it.id;   // новая позиция должна быть видна поверх шторки, а не за ней
  save();
  return it;
}
function punchAll(){
  const o=order(S.activeTable); if(!o) return;
  const now=Date.now(); const just=[];
  o.items.forEach(i=>{ if(!i.punchedAt){i.punchedAt=now;i.notified=false;just.push(i);} });
  save();
  if(just.length){ S.scrollTo=just[0].id; showPunchCard(o.table, just); } else render();
}

/* карточка-подтверждение: какой стол и что именно только что пробито */
let punchCardT=null;
function showPunchCard(table, items){
  // при открытой шторке карточка легла бы на поиск, а саму пробитую позицию и так
  // видно: она подтянута к верху и подсвечена — хватит короткого тоста
  if(S.menuOpen){
    toast('Стол '+table+': пробито '+(items.length===1?items[0].name:items.length+' поз.'));
    return;
  }
  S.punchCard={table, items: items.map(i=>({name:i.name, qty:i.qty}))};
  render();
  clearTimeout(punchCardT);
  punchCardT=setTimeout(()=>{S.punchCard=null;render();},3200);
}

/* ================= RENDER ================= */
function render(){
  const tb=document.getElementById('topbar'), mn=document.getElementById('main'), bt=document.getElementById('bottom');
  // перерисовка собирает DOM заново — без этого список уезжает наверх, а фокус
  // из поиска слетает и на телефоне закрывается клавиатура прямо посреди набора
  const keepMain=mn.scrollTop;
  const oldList=document.querySelector('.md-list');
  const keepList=oldList?oldList.scrollTop:0;
  const act=document.activeElement;
  const keepFocus=act&&act.classList&&act.classList.contains('search')?
    (act.closest('.menudrawer')?'drawer':'screen'):null;
  const keepSel=keepFocus?[act.selectionStart,act.selectionEnd]:null;
  document.querySelectorAll('.scrim,.toast,.punchcard,.menudrawer').forEach(e=>e.remove());
  if(S.screen==='floor') renderFloor(tb,mn,bt);
  else if(S.screen==='table') renderTable(tb,mn,bt);
  else if(S.screen==='stop') renderStop(tb,mn,bt);
  else if(S.screen==='wine') renderWine(tb,mn,bt);
  else if(S.screen==='settings') renderSettings(tb,mn,bt);
  if(S.screen==='table' && S.menuOpen) renderMenuDrawer();
  if(S.sheet) renderSheet();
  // при открытой шторке тост уводим наверх: внизу он ложится на список блюд
  if(S.toast){ const t=document.createElement('div'); t.className='toast'+(S.menuOpen?' overdrawer':''); t.textContent=S.toast; document.body.appendChild(t); }
  if(S.punchCard){
    const pc=el(`<div class="punchcard">
      <div class="pc-h">✓ Стол ${esc(S.punchCard.table)} — пробито</div>
      ${S.punchCard.items.map(i=>`<div class="pc-row"><span class="pc-q">${i.qty}×</span><span>${esc(i.name)}</span></div>`).join('')}
    </div>`);
    pc.onclick=()=>{ clearTimeout(punchCardT); S.punchCard=null; render(); };
    document.body.appendChild(pc);
  }
  fitDrawer();   // до восстановления прокрутки: меняет высоту содержимого
  mn.scrollTop=keepMain;
  const newList=document.querySelector('.md-list');
  if(newList) newList.scrollTop=keepList;
  // только что пробитая или добавленная позиция — к верху видимой части:
  // при открытой шторке и клавиатуре от заказа остаётся узкая полоса сверху
  if(S.scrollTo){
    const row=mn.querySelector(`.item[data-iid="${S.scrollTo}"]`);
    if(row){
      mn.scrollTop=Math.max(0, mn.scrollTop+row.getBoundingClientRect().top-mn.getBoundingClientRect().top-6);
      row.classList.add('flash');
    }
    S.scrollTo=null;
  }
  if(keepFocus&&!S.sheet){
    const inp=keepFocus==='drawer'?document.querySelector('.menudrawer .search'):document.querySelector('main .search');
    if(inp&&document.activeElement!==inp){
      inp.focus();
      try{ inp.setSelectionRange(keepSel[0],keepSel[1]); }catch(e){}
    }
  }
}
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.children.length===1 ? d.firstElementChild : d; }
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
/* готовые комментарии: у стола нет времени набирать «без лука» руками —
   тап по чипу добавляет или убирает фразу, своё можно дописать снизу */
const QUICK_COMMENTS=['без лука','без соли','без чеснока','без сыра','без соуса','соус отдельно',
  'поострее','не острое','без льда','подать позже','подать сразу','с собой','аллергия!','приборы'];
function commentHas(cur,phrase){
  return (cur||'').split(',').map(s=>s.trim().toLowerCase()).includes(phrase.toLowerCase());
}
function commentToggle(cur,phrase){
  const parts=(cur||'').split(',').map(s=>s.trim()).filter(Boolean);
  const i=parts.findIndex(p=>p.toLowerCase()===phrase.toLowerCase());
  if(i>=0) parts.splice(i,1); else parts.push(phrase);
  return parts.join(', ');
}
function quickComments(cur,onChange){
  const box=el('<div class="chips qc"></div>');
  QUICK_COMMENTS.forEach(p=>{
    const b=el(`<button class="chip sm ${commentHas(cur,p)?'on':''}">${esc(p)}</button>`);
    b.onclick=()=>onChange(commentToggle(cur,p));
    box.appendChild(b);
  });
  return box;
}

/* поисковая строка с кнопкой «×» для быстрой очистки — переиспользуется в меню/стопах/вине */
function searchBox(placeholder, value, onChange){
  const wrap=el(`<div class="searchwrap">
    <input class="search" placeholder="${esc(placeholder)}" value="${esc(value)}">
    <button class="searchclear" type="button" ${value?'':'style="display:none"'}>×</button>
  </div>`);
  const inp=wrap.querySelector('input'), clr=wrap.querySelector('.searchclear');
  inp.oninput=()=>{ clr.style.display=inp.value?'':'none'; onChange(inp.value); };
  clr.onclick=()=>{ inp.value=''; clr.style.display='none'; onChange(''); inp.focus(); };
  return wrap;
}

/* --- floor --- */
function renderFloor(tb,mn,bt){
  const zones=parseTables(S.tablesText);
  const openN=Object.keys(S.orders).length;
  tb.innerHTML=`<h1>Зал <span class="sub">${openN} откр.</span></h1>
    <button class="iconbtn" id="go-wine">Вино</button>
    <button class="iconbtn" id="go-stop">Стопы</button>
    <button class="iconbtn" id="go-set">⚙</button>`;
  tb.querySelector('#go-wine').onclick=()=>{S.screen='wine';S.wq='';render();};
  tb.querySelector('#go-stop').onclick=()=>{S.screen='stop';S.query='';render();};
  tb.querySelector('#go-set').onclick=()=>{S.screen='settings';render();};

  mn.innerHTML='';
  const rd=readyItems();
  if(rd.length){
    const strip=el('<div class="readybar"></div>');
    strip.appendChild(el(`<div class="rb-h">Готово — забрать (${rd.length})</div>`));
    rd.slice(0,8).forEach(({o,i,at})=>{
      const r=el(`<div class="rb-row" data-at="${at}"><span class="rb-t">${esc(o.table)}</span><span class="rb-n">${esc(i.name)}</span><span class="rb-w">${mmss(Date.now()-at)}</span></div>`);
      r.onclick=()=>{S.activeTable=o.table;S.activeGuest='all';S.screen='table';S.menuOpen=false;render();};
      strip.appendChild(r);
    });
    mn.appendChild(strip);
  }
  if(!zones.length){ mn.innerHTML='<div class="hint">Столы не заданы.<br>Открой настройки и опиши карту зала.</div>'; }
  zones.forEach(z=>{
    if(z.name) mn.appendChild(el(`<div class="zone-title">${esc(z.name)}</div>`));
    const g=el('<div class="grid"></div>');
    z.tables.forEach(num=>{
      const o=order(num), st=orderStatus(o), up=unpunched(o), rc=readyCount(o);
      const cell=el(`<div class="tcell ${st==='free'?'':st}" data-table="${esc(num)}">
        <div class="num">${esc(num)}</div>
        <div class="meta">
          <span>${o?('👥'+o.guests):'свободен'}</span>
          <span>${o?mmss(Date.now()-o.openedAt):''}</span>
        </div>
        ${rc?`<div class="badge rdy">${rc} готово</div>`:(up?`<div class="badge">${up}</div>`:'')}
      </div>`);
      cell.onclick=()=>{
        if(o){ S.activeTable=num; S.activeGuest=1; S.screen='table'; S.menuOpen=false; render(); }
        else { S.sheet={type:'open',table:num,guests:2}; render(); }
      };
      g.appendChild(cell);
    });
    mn.appendChild(g);
  });
  mn.appendChild(el(`<div class="legend">
    <span><i class="dot" style="background:var(--free)"></i>свободен</span>
    <span><i class="dot" style="background:var(--busy)"></i>занят</span>
    <span><i class="dot" style="background:var(--precheck)"></i>пречек</span>
    <span><i class="dot" style="background:var(--alert)"></i>готово / висит</span>
    <span><i class="dot" style="background:var(--new)"></i>цифра — не пробито</span>
  </div>`));

  bt.style.display='none';

/* --- table order --- */
function renderTable(tb,mn,bt){
  bt.style.display='flex';
  const o=order(S.activeTable);
  if(!o){ S.screen='floor'; render(); return; }
  tb.innerHTML=`<button class="back" id="bk">‹ Зал</button>
    <h1 id="thead">Стол ${esc(o.table)} <span class="chev">▾</span> <span class="sub">${o.guests} гост. · <span id="tbl-elapsed">${mmss(Date.now()-o.openedAt)}</span></span></h1>
    <button class="iconbtn" id="gplus">+гость</button>`;
  tb.querySelector('#bk').onclick=()=>{S.screen='floor';S.menuOpen=false;render();};
  tb.querySelector('#thead').onclick=()=>{S.sheet={type:'table'};S.menuOpen=false;render();};
  tb.querySelector('#gplus').onclick=()=>{o.guests++;save();render();};

  mn.innerHTML='';
  const tabs=el('<div class="guesttabs"></div>');
  const all=el(`<button class="gtab ${S.activeGuest==='all'?'on':''}">Все</button>`);
  all.onclick=()=>{S.activeGuest='all';render();};
  tabs.appendChild(all);
  for(let g=1;g<=o.guests;g++){
    const cnt=o.items.filter(i=>i.guest===g).length;
    const b=el(`<button class="gtab ${S.activeGuest===g?'on':''}">Г${g}${cnt?' · '+cnt:''}</button>`);
    b.onclick=()=>{S.activeGuest=g;render();};
    tabs.appendChild(b);
  }
  mn.appendChild(tabs);

  if(!o.items.length){
    mn.appendChild(el('<div class="hint">Заказ пуст.<br>Нажми «+ Блюдо» и выбирай со слов гостя.</div>'));
  } else {
    const groups = S.activeGuest==='all' ? Array.from({length:o.guests},(_,i)=>i+1) : [S.activeGuest];
    groups.forEach(g=>{
      const items=o.items.filter(i=>i.guest===g);
      if(!items.length && S.activeGuest==='all') return;
      const sec=el(`<div class="gsec"><h3>Гость ${g}${items.length?' — '+money(items.reduce((a,i)=>a+i.price*i.qty,0))+' ₸':''}</h3></div>`);
      if(!items.length) sec.appendChild(el('<div class="hint" style="padding:14px;font-size:12.5px">нет позиций</div>'));
      items.forEach(i=>sec.appendChild(itemRow(i)));
      mn.appendChild(sec);
    });
  }
  const up=unpunched(o);
  const subT=subtotal(o), svc=serviceAmount(o);
  mn.appendChild(el(`<div class="sumline"><span>${up?('не пробито: '+up):'всё пробито'}</span><span>${money(subT)} ₸</span></div>`));
  if(svc) mn.appendChild(el(`<div class="sumline nb"><span>сервис ${S.serviceFee}%</span><span>${money(svc)} ₸</span></div>`));
  mn.appendChild(el(`<div class="sumline nb"><span>итого</span><b>${money(total(o))} ₸</b></div>`));

  bt.innerHTML='';
  const addB=el('<button class="btn">+ Блюдо</button>');
  addB.onclick=()=>{S.menuOpen=true;S.query='';render();};
  bt.appendChild(addB);
  if(up){
    const pb=el('<button class="btn green">Пробить всё</button>');
    pb.onclick=punchAll; bt.appendChild(pb);
  } else {
    const cb=el(`<button class="btn ${o.status==='precheck'?'ghost':'amber'}">${o.status==='precheck'?'Закрыть стол':'Пречек'}</button>`);
    cb.onclick=()=>{
      if(o.status!=='precheck'){ o.status='precheck'; o.precheckAt=Date.now(); o.checks.precheck=true; save(); render(); }
      else { S.sheet={type:'close'}; render(); }
    };
    bt.appendChild(cb);
  }
}
/* динамическая часть строки позиции (класс + таймер) — отдельно от разметки,
   чтобы секундный тик мог патчить только текст, не пересобирая DOM (см. patchLiveTimers) */
function itemLiveState(i){
  const now=Date.now();
  const r=readyAt(i), ready=isReady(i);
  const lateNoCook = i.punchedAt && !i.cook && !i.delivered && (now-i.punchedAt)>S.lateMin*60000;
  const cls = i.delivered?'done':(ready||lateNoCook?'late':(i.punchedAt?'punched':''));
  let tmr='';
  if(i.punchedAt && !i.delivered){
    if(r && ready) tmr=`<div class="tmr ready">ГОТОВО · ждёт ${mmss(now-r)}</div>`;
    else if(r) tmr=`<div class="tmr">готово через ${mmss(r-now)}</div>`;
    else tmr=`<div class="tmr ${lateNoCook?'late':''}">на кухне ${mmss(now-i.punchedAt)}</div>`;
  }
  return {cls, tmr};
}
function itemRow(i){
  const {cls, tmr}=itemLiveState(i);
  const mods=Object.entries(i.mods||{}).map(([k,v])=>`${esc(k)}: <b>${esc(v)}</b>`).join(' · ');
  const dish=menu.dishes.find(x=>x.id===i.dishId);
  const hasPairing = dish && (pairingFor(dish) || dish.wine);
  const row=el(`<div class="item ${cls} ${i.punchedAt?'sent':''}" data-iid="${i.id}">
    <div class="body">
      <div class="nm">${esc(i.name)}${i.cook?`<span class="ct">${i.cook}м</span>`:''}</div>
      ${mods?`<div class="det">${mods}</div>`:''}
      ${i.comment?`<div class="det">💬 ${esc(i.comment)}</div>`:''}
      ${tmr}
      <div class="qrow">
        <button class="qbtn" data-a="minus">−</button>
        <span class="qn">${i.qty}</span>
        <button class="qbtn" data-a="plus">+</button>
        <button class="qbtn cmt ${i.comment?'on':''}" data-a="cmt">💬</button>
        <button class="qbtn del" data-a="del">✕</button>
        <span class="qsum">${money(i.price*i.qty)} ₸</span>
      </div>
    </div>
    <div class="flags">
      <button class="flag ${i.punchedAt?'on':''}" data-a="p">П</button>
      <button class="flag ${i.delivered?'on':''}" data-a="d" ${i.punchedAt?'':'disabled'}>О</button>
      ${hasPairing?'<button class="flag wine" data-a="w">🍷</button>':''}
    </div>
  </div>`);
  row.querySelector('.body').onclick=e=>{
    if(e.target.closest('.qrow')) return;   // кнопки количества и удаления — не открывают карточку
    S.sheet={type:'item',itemId:i.id}; render();
  };
  row.querySelector('[data-a="cmt"]').onclick=()=>{ S.sheet={type:'comment',itemId:i.id}; render(); };
  row.querySelector('[data-a="p"]').onclick=()=>{
    if(i.punchedAt){i.punchedAt=null;i.delivered=false;i.notified=false;save();render();}
    else {
      i.punchedAt=Date.now(); i.notified=false;
      const o=order(S.activeTable);
      S.scrollTo=i.id;      // подтягиваем пробитую позицию к верху экрана
      save(); showPunchCard(o.table,[i]);
    }
  };
  row.querySelector('[data-a="d"]').onclick=()=>{ i.delivered=!i.delivered; save(); render(); };
  row.querySelector('[data-a="plus"]').onclick=()=>{ i.qty++; save(); render(); };
  row.querySelector('[data-a="minus"]').onclick=()=>{ if(i.qty>1){ i.qty--; save(); render(); } };
  row.querySelector('[data-a="del"]').onclick=()=>{
    // непробитую позицию убираем сразу — это свежая опечатка; пробитую уже
    // готовят на кухне, поэтому спрашиваем
    if(i.punchedAt&&!confirm('«'+i.name+'» уже пробито. Всё равно удалить?')) return;
    const o=order(S.activeTable);
    o.items=o.items.filter(x=>x.id!==i.id);
    save(); render(); toast('Удалено: '+i.name);
  };
  const wBtn=row.querySelector('[data-a="w"]');
  if(wBtn) wBtn.onclick=()=>{ S.sheet={type:'pairing', dishId:i.dishId}; render(); };
  return row;
}

/* --- menu picker: выдвижная шторка снизу поверх стола, а не отдельный экран —
   официант должен видеть список позиций стола (что пробито/новое), пока
   выбирает блюдо, а не терять его на весь экран (см. CONTEXT.md) --- */
function renderMenuDrawer(){
  const wrap=el(`<div class="menudrawer">
    <div class="md-handle"></div>
    <div class="md-head">
      <div>Меню <span class="sub">→ Г${S.activeGuest==='all'?1:S.activeGuest}</span></div>
      <button class="smallbtn" id="md-close">Готово</button>
    </div>
  </div>`);
  wrap.querySelector('#md-close').onclick=()=>{S.menuOpen=false;render();};
  const sw=searchBox('Поиск: цез, кпч, стейк...', S.query, v=>{S.query=v;renderMenuList(list);});
  wrap.appendChild(sw);
  const list=el('<div class="md-list"></div>');
  wrap.appendChild(list);
  renderMenuList(list);
  document.body.appendChild(wrap);
  if(S.query){ const inp=sw.querySelector('input'); setTimeout(()=>{inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);},0); }
}
/* клавиатура перекрывала шторку: поднимаем её на высоту клавиатуры и ужимаем
   по реальной видимой области, иначе список блюд уезжает под клавиатуру */
function fitDrawer(){
  const mn=document.getElementById('main');
  const d=document.querySelector('.menudrawer');
  if(!d){
    if(mn) mn.style.paddingBottom='';
    document.documentElement.style.setProperty('--drawer-h','0px');
    return;
  }
  const vv=window.visualViewport;
  if(vv){
    const kb=Math.max(0, Math.round(window.innerHeight-vv.height-vv.offsetTop));
    d.style.bottom=kb+'px';
    d.style.maxHeight=Math.max(200, Math.round(vv.height*(kb>120?0.6:0.56)))+'px';
  }
  // запас снизу под шторкой: без него нижние позиции навсегда прячутся за ней.
  // Берём почти целый экран, чтобы к верху могла подняться даже последняя позиция
  if(mn) mn.style.paddingBottom=Math.round(window.innerHeight*0.75)+'px';
  // тост при открытой шторке встаёт в просвет над ней, а не на список и не на заказ
  const kb2=window.visualViewport?Math.max(0,Math.round(window.innerHeight-window.visualViewport.height-window.visualViewport.offsetTop)):0;
  document.documentElement.style.setProperty('--drawer-h',Math.round(d.getBoundingClientRect().height+kb2)+'px');
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',fitDrawer);
  window.visualViewport.addEventListener('scroll',fitDrawer);
}
function dishRow(d,showCrumb,allergenHit){
  const r=remaining(d.id), stopped=S.stop[d.id], ok=dishAvailable(d);
  const tags=[];
  if(stopped) tags.push('<span class="tag stop">стоп</span>');
  if(S.go[d.id]) tags.push('<span class="tag go">гоу</span>');
  if(r!==null&&!stopped) tags.push(`<span class="tag lim">ост. ${Math.max(0,r)}</span>`);
  if(d.mods.some(m=>m.required)) tags.push('<span class="tag mod">мод</span>');
  if(d.cook) tags.push(`<span class="tag time">${d.cook}м</span>`);
  if(d.allergens&&d.allergens.length){ const _al=d.allergens; tags.push(`<span class="tag alg${allergenHit?' hit':''}">⚠ ${esc(_al.slice(0,3).join(', '))}${_al.length>3?' +'+(_al.length-3):''}</span>`); }
  const row=el(`<div class="dish ${ok?'':'off'}">
    <div class="dn">${esc(d.name)}${tags.join('')}
      ${showCrumb?`<div class="crumb">${esc(d.cat)}${d.sub?' · '+esc(d.sub):''}</div>`:''}
    </div>
    <div class="dp">${d.price?money(d.price):''}</div>
  </div>`);
  if(ok) row.onclick=()=>pickDish(d);
  if(pairingFor(d)){
    const wbtn=el('<button class="winetag">🍷</button>');
    wbtn.onclick=(e)=>{ e.stopPropagation(); S.sheet={type:'pairing', dishId:d.id}; render(); };
    row.appendChild(wbtn);
  }
  return row;
}
function renderMenuList(container){
  container.innerHTML='';
  if(S.query.trim()){
    const found=rankDishes(menu.dishes,S.query).slice(0,40);
    if(!found.length){ container.appendChild(el('<div class="hint">Ничего не нашлось</div>')); return; }
    found.forEach(x=>container.appendChild(dishRow(x.d,true,x.alg)));
    return;
  }
  const gos=menu.dishes.filter(d=>S.go[d.id]&&dishAvailable(d));
  if(gos.length){
    container.appendChild(el('<div class="zone-title">Гоу-лист</div>'));
    gos.forEach(d=>container.appendChild(dishRow(d,true)));
  }
  menu.cats.forEach(c=>{
    const open=!!S.openCats[c.name];
    const box=el(`<div class="cat"><div class="head">${esc(c.name)}<span class="chev">${open?'▾':'▸'}</span></div></div>`);
    box.querySelector('.head').onclick=()=>{S.openCats[c.name]=!open;renderMenuList(container);};
    if(open){
      c.subs.forEach(s=>{
        if(!s.name){
          const sb=el('<div class="sub"></div>');
          s.dishes.forEach(d=>sb.appendChild(dishRow(d,false)));
          box.appendChild(sb);
          return;
        }
        const subKey=c.name+'|'+s.name;
        const subOpen=!!S.openSubs[subKey];
        const sh=el(`<div class="subhead">${esc(s.name)}<span class="chev">${subOpen?'▾':'▸'}</span></div>`);
        sh.onclick=()=>{S.openSubs[subKey]=!subOpen;renderMenuList(container);};
        box.appendChild(sh);
        if(subOpen){
          const sb=el('<div class="sub"></div>');
          s.dishes.forEach(d=>sb.appendChild(dishRow(d,false)));
          box.appendChild(sb);
        }
      });
    }
    container.appendChild(box);
  });
}
function pickDish(d){
  const guest = S.activeGuest==='all'?1:S.activeGuest;
  if(d.mods.length){ S.sheet={type:'mods',dish:d,guest,qty:1,sel:{},comment:''}; render(); return; }
  addItem(d,guest,1,{},'');
  afterAdd(d.name+' → Г'+guest);
}
/* поле поиска чистим сразу после добавления: следующее блюдо набирается с нуля,
   а фокус остаётся в поле — клавиатура не закрывается между позициями */
function afterAdd(msg){
  S.query='';
  toast(msg);
  const inp=document.querySelector('.menudrawer .search');
  if(inp){ inp.value=''; inp.focus(); }
}

/* --- stop list screen --- */
function renderStop(tb,mn,bt){
  bt.style.display='flex';
  tb.innerHTML=`<button class="back" id="bk">‹ Зал</button><h1>Стоп / гоу / лимиты</h1>`;
  tb.querySelector('#bk').onclick=()=>{S.screen='floor';S.query='';render();};
  mn.innerHTML='';
  const sw=searchBox('Найти блюдо', S.query, v=>{S.query=v;fill();});
  mn.appendChild(sw);
  const inp=sw.querySelector('input');
  const list=el('<div></div>'); mn.appendChild(list);
  function fill(){
    list.innerHTML='';
    const src = S.query.trim()
      ? rankDishes(menu.dishes,S.query).map(x=>x.d)
      : menu.dishes.filter(d=>S.stop[d.id]||S.go[d.id]||S.limits[d.id]!==undefined);
    const wineStopped=wines.filter(w=>S.wstop[slug(w.name)]!==undefined);
    if(!src.length&&!(wineStopped.length&&!S.query.trim())){
      list.appendChild(el('<div class="hint">Ограничений нет.<br>Вставь стоп-лист текстом или найди блюдо в поиске.</div>'));
      return;
    }
    src.slice(0,60).forEach(d=>{
      const r=remaining(d.id);
      const row=el(`<div class="stoprow">
        <div class="sn">${esc(d.name)}<div class="sc">${esc(d.cat)}${d.sub?' · '+esc(d.sub):''}${r!==null?' · осталось '+Math.max(0,r):''}</div></div>
        <input class="limbox" placeholder="лим" value="${S.limits[d.id]!==undefined?S.limits[d.id]:''}">
        <button class="mini ${S.go[d.id]?'goon':''}" data-a="go">ГОУ</button>
        <button class="mini ${S.stop[d.id]?'stopon':''}" data-a="stop">СТОП</button>
      </div>`);
      row.querySelector('[data-a="stop"]').onclick=()=>{
        if(S.stop[d.id]) delete S.stop[d.id]; else {S.stop[d.id]=1; delete S.go[d.id];}
        save();fill();
      };
      row.querySelector('[data-a="go"]').onclick=()=>{
        if(S.go[d.id]) delete S.go[d.id]; else {S.go[d.id]=1; delete S.stop[d.id];}
        save();fill();
      };
      const lb=row.querySelector('.limbox');
      lb.onchange=()=>{
        const v=lb.value.trim();
        if(v==='') delete S.limits[d.id]; else S.limits[d.id]=parseInt(v,10)||0;
        save();fill();
      };
      list.appendChild(row);
    });
    if(src.length>60) list.appendChild(el(`<div class="hint" style="padding:10px;font-size:12px">Показаны первые 60 из ${src.length}</div>`));
    // бутылки из винной карты: в меню их нет, но в стоп-листе бара они есть всегда
    if(wineStopped.length&&!S.query.trim()){
      list.appendChild(el(`<div class="zone-title">Вино · стоп (${wineStopped.length})</div>`));
      wineStopped.forEach(w=>{
        const id=slug(w.name), st=S.wstop[id];
        const row=el(`<div class="stoprow">
          <div class="sn">${esc(w.name)}<div class="sc">${esc(w.cat)}${w.country?' · '+esc(w.country):''}${st>0?' · осталось '+st:''}</div></div>
          <button class="mini stopon" data-a="wstop">СТОП</button>
        </div>`);
        row.querySelector('[data-a="wstop"]').onclick=()=>{ delete S.wstop[id]; save(); fill(); };
        list.appendChild(row);
      });
    }
  }
  fill();
  if(S.query) setTimeout(()=>{inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);},0);
  bt.innerHTML='';
  const paste=el('<button class="btn">Вставить текстом</button>');
  paste.onclick=()=>{ S.sheet={type:'stoptext',text:'',replace:false,pick:{}}; render(); };
  bt.appendChild(paste);
  const clr=el('<button class="btn ghost">Снять все</button>');
  clr.onclick=()=>{ if(confirm('Снять все стопы, гоу и лимиты?')){S.stop={};S.go={};S.limits={};S.wstop={};save();fill();} };
  bt.appendChild(clr);
}

function renderWine(tb,mn,bt){
  bt.style.display='none'; bt.innerHTML='';
  const stopN=Object.keys(S.wstop).length;
  tb.innerHTML=`<button class="back" id="bk">‹ Зал</button><h1>Винная карта <span class="sub">бутылки · ${wines.length}${stopN?' · стоп '+stopN:''}</span></h1>`;
  tb.querySelector('#bk').onclick=()=>{S.screen='floor';S.wq='';render();};
  mn.innerHTML='';
  const sw=searchBox('Поиск: страна, сорт, название…', S.wq||'', v=>{S.wq=v;fill();});
  mn.appendChild(sw);
  const inp=sw.querySelector('input');
  const list=el('<div></div>'); mn.appendChild(list);
  function fill(){
    list.innerHTML='';
    const q=(S.wq||'').trim();
    const src=wines.filter(w=> !q || textMatch(w.name,q)||textMatch(w.country,q)||textMatch(w.meta,q)||textMatch(w.cat,q));
    if(!src.length){ list.appendChild(el('<div class="hint">Ничего не нашлось</div>')); return; }
    let curHead=null;
    src.forEach(w=>{
      const head = w.cat+(w.country?' · '+w.country:'');
      if(head!==curHead){ curHead=head; list.appendChild(el(`<div class="zone-title">${esc(head)}</div>`)); }
      const id=slug(w.name), st=S.wstop[id];
      const tag = st===undefined ? '' : (st>0?`<span class="tag lim">ост. ${st}</span>`:'<span class="tag stop">стоп</span>');
      const row=el(`<div class="stoprow"${st===0?' style="opacity:.45"':''}><div class="sn">${esc(w.name)}${tag}${w.meta?`<div class="sc">${esc(w.meta)}</div>`:''}</div><div class="wprice">${money(w.price)} ₸</div></div>`);
      row.onclick=()=>{
        const on=S.wstop[id]===undefined;
        if(on) S.wstop[id]=0; else delete S.wstop[id];
        save(); render(); toast(on?'Стоп: '+w.name:'Снят стоп: '+w.name);
      };
      list.appendChild(row);
    });
  }
  fill();
  if(S.wq) setTimeout(()=>{inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);},0);
}

/* Принудительное обновление: снимаем service worker и чистим его кэш, затем
   грузимся с новым адресом, чтобы не подхватить страницу из HTTP-кэша.
   localStorage не трогаем — там заказы и настройки смены. */
async function hardUpdate(){
  if(navigator.onLine===false){ toast('Нет сети — обновить не выйдет'); return; }
  toast('Обновляю…');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  location.replace(location.origin+location.pathname+'?u='+Date.now());
}

      const f=el(`<div class="field"><label>${esc(g.name)}</label><div class="chips"></div></div>`);
