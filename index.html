      b.onclick=()=>{
        const old=o.table;
        o.table=n; S.orders[n]=o; delete S.orders[old];
        S.activeTable=n; S.sheet=null; save(); render(); toast('Стол '+old+' → '+n);
      };
      mf.querySelector('.chips').appendChild(b);
    });
    sh.appendChild(mf);

    const gf=el('<div class="field"><label>Гостей</label><div class="stepper"><button id="gm">−</button><span class="v" id="gv"></span><button id="gp">+</button></div></div>');
    gf.querySelector('#gv').textContent=o.guests;
    gf.querySelector('#gm').onclick=()=>{ if(o.guests>1){o.guests--;save();render();} };
    gf.querySelector('#gp').onclick=()=>{ o.guests++; save(); render(); };
    sh.appendChild(gf);

    const del=el('<button class="rowbtn danger">Удалить стол вместе с заказом</button>');
    del.onclick=()=>{
      const warn=o.items.length?`Стол ${o.table}: удалить заказ на ${o.items.length} поз. (${money(total(o))} ₸)?`:`Закрыть пустой стол ${o.table}?`;
      if(!confirm(warn)) return;
      const n=o.table;
      delete S.orders[n]; S.sheet=null; S.screen='floor'; S.menuOpen=false;
      save(); render(); toast('Стол '+n+' удалён');
    };
    sh.appendChild(del);
    const cl=el('<button class="btn ghost" style="width:100%">Готово</button>');
    cl.onclick=()=>{S.sheet=null;render();};
    sh.appendChild(cl);
  }

  else if(t==='pairing'){
    const dish=menu.dishes.find(x=>x.id===S.sheet.dishId);
    const p=dish?pairingFor(dish):null;
    sh.appendChild(el(`<h2>🍷 ${esc(dish?dish.name:'')}</h2><div class="sh-sub">Что предложить к блюду</div>`));
    if(p){
      if(p.glass) sh.appendChild(el(`<div class="pair-block"><div class="pair-label">По бокалам</div><div class="pair-name">${esc(p.glass.name)}</div>${p.glass.why?`<div class="pair-why">${esc(p.glass.why)}</div>`:''}</div>`));
      p.bottles.forEach((b,idx)=>sh.appendChild(el(`<div class="pair-block"><div class="pair-label">Бутылка${p.bottles.length>1?' · вариант '+(idx+1):''}</div><div class="pair-name">${esc(b.name)}</div>${b.why?`<div class="pair-why">${esc(b.why)}</div>`:''}</div>`)));
    } else if(dish&&dish.wine){
      sh.appendChild(el(`<div class="pair-block"><div class="pair-label">По бокалам</div><div class="pair-name">${esc(dish.wine)}</div></div>`));
    } else {
      sh.appendChild(el('<div class="hint" style="padding:20px 8px">Пейринг для этого блюда не задан</div>'));
    }
    const cl=el('<button class="btn ghost" style="width:100%">Готово</button>');
    cl.onclick=()=>{S.sheet=null;render();};
    sh.appendChild(cl);
  }

  else if(t==='stoptext'){
    sh.appendChild(el(`<h2>Стоп-лист текстом</h2><div class="sh-sub">Вставь сообщение из группы — стопы, ограничения и гоу распознаются сами</div>`));
    const ta=el(`<div class="field"><textarea id="st" rows="5" placeholder="КУХНЯ ОГРАНИЧЕНИЕ:&#10;Щёки с пюре 6 порций&#10;&#10;СТОП ЛИСТ БАР&#10;Текила:&#10;Avion&#10;Все авторские коктейли">${esc(S.sheet.text)}</textarea></div>`);
    sh.appendChild(ta);
    if(navigator.clipboard&&navigator.clipboard.readText){
      const pb=el('<button class="smallbtn ghost" style="margin:-8px 0 14px">Вставить из буфера</button>');
      pb.onclick=async()=>{
        try{ const t2=await navigator.clipboard.readText(); if(t2){ S.sheet.text=t2; render(); } }
        catch(e){ toast('Буфер недоступен — вставь вручную'); }
      };
      sh.appendChild(pb);
    }
    const prev=el('<div></div>');
    sh.appendChild(prev);

    const rep=el(`<label class="checkrow"><input type="checkbox" ${S.sheet.replace?'checked':''}> Сначала снять текущие стопы</label>`);
    rep.querySelector('input').onchange=e=>{ S.sheet.replace=e.target.checked; };
    sh.appendChild(rep);

    const acts=el('<div class="acts" style="margin-top:14px"></div>');
    const c=el('<button class="btn ghost">Отмена</button>'); c.onclick=()=>{S.sheet=null;render();};
    const k=el('<button class="btn green">Поставить стоп</button>');
    acts.append(c,k); sh.appendChild(acts);

    let res={actions:[],suggest:[],unknown:[],choose:[],notes:[]};
    const label=r=>[r.go?'ГОУ':(r.stop?'СТОП':''),r.limit!=null?'лим. '+r.limit:''].filter(Boolean).join(' · ');
    const mkRec=(line,target,qty,mode)=>({line,target,limit:qty!=null?qty:null,go:mode==='go',stop:qty==null&&mode!=='go'});
    const picked=()=>{
      const outp=res.suggest.filter((r,i)=>S.sheet.pick['s'+i]);
      res.choose.forEach((ch,i)=>{
        const sel=S.sheet.pick['c'+i]||{};
        ch.items.forEach((it,j)=>{ if(sel[j]) outp.push(mkRec(ch.line,it,ch.qty,ch.mode)); });
      });
      return outp;
    };
    const chooseLeft=()=>res.choose.filter((ch,i)=>{
      const sel=S.sheet.pick['c'+i]||{};
      return !ch.items.some((it,j)=>sel[j]);
    }).length;
    function preview(){
      res=parseStopText(S.sheet.text);
      prev.innerHTML='';
      const apply=()=>res.actions.length+picked().length;
      if(!S.sheet.text.trim()){ k.disabled=true; k.textContent='Применить'; return; }
      if(res.actions.length){
        prev.appendChild(el(`<div class="okbox"><b>Распознано: ${res.actions.length}</b><br>${
          res.actions.map(r=>`${r.near?'≈ ':''}${esc(r.target.name)}${r.target.kind==='wine'?' 🍷':''} — <b>${label(r)}</b>`).join('<br>')
        }</div>`));
      }
      if(res.notes.length){
        prev.appendChild(el(`<div class="okbox" style="opacity:.85">${
          res.notes.map(n=>`«${esc(n.line)}» → группа целиком, ${n.count} поз.`).join('<br>')
        }</div>`));
      }
      if(res.suggest.length){
        const box=el(`<div class="warnbox"><b>⚠ Похоже на опечатку: ${res.suggest.length}</b><div style="opacity:.75;margin:3px 0 6px">Нажми, если это оно.</div></div>`);
        res.suggest.forEach((r,i)=>{
          const b=el(`<button class="chip ${S.sheet.pick['s'+i]?'on':''}" style="margin:3px 4px 0 0;text-align:left">«${esc(r.line)}» → ${esc(r.target.name)}</button>`);
          b.onclick=()=>{ S.sheet.pick['s'+i]=!S.sheet.pick['s'+i]; preview(); };
          box.appendChild(b);
        });
        prev.appendChild(box);
      }
      if(res.choose.length){
        const box=el(`<div class="warnbox"><b>⚠ Нужно выбрать: ${res.choose.length}</b><div style="opacity:.75;margin:3px 0 6px">Сам не угадываю — ткни нужное. Можно отметить сразу несколько.</div></div>`);
        res.choose.forEach((ch,i)=>{
          const sel=S.sheet.pick['c'+i]||{};
          box.appendChild(el(`<div style="margin-top:6px">«${esc(ch.line)}»</div>`));
          ch.items.forEach((it,j)=>{
            const b=el(`<button class="chip ${sel[j]?'on':''}" style="margin:3px 4px 0 0;text-align:left">${esc(it.name)}${it.kind==='wine'?' 🍷':''}</button>`);
            b.onclick=()=>{
              const cur=S.sheet.pick['c'+i]||{};
              cur[j]=!cur[j]; S.sheet.pick['c'+i]=cur; preview();
            };
            box.appendChild(b);
          });
        });
        prev.appendChild(box);
      }
      if(res.unknown.length){
        prev.appendChild(el(`<div class="warnbox"><b>⚠ Нет в меню и винной карте: ${res.unknown.length}</b><br>${
          res.unknown.map(u=>'«'+esc(u)+'»').join(', ')
        }<br><span style="opacity:.75">Проверь название или добавь позицию в меню в настройках.</span></div>`));
      }
      if(!res.actions.length&&!res.unknown.length&&!res.choose.length&&!res.suggest.length){
        prev.appendChild(el('<div class="warnbox">В тексте не нашлось ни одной позиции</div>'));
      }
      k.disabled=!apply();
      k.textContent=apply()?`Применить (${apply()})`:'Применить';
    }
    // превью пересобираем точечно, без render() — иначе фокус в поле слетает на каждом символе.
    // Разбор длинного списка стоит ~20 мс на десктопе и заметно больше на телефоне,
    // поэтому при ручной правке ждём паузу в наборе, а не считаем на каждую букву
    let prevT=null;
    ta.querySelector('#st').oninput=e=>{
      S.sheet.text=e.target.value; S.sheet.pick={};
      clearTimeout(prevT); prevT=setTimeout(preview,200);
    };
    preview();

    k.onclick=()=>{
      const chosen=picked();
      const list=res.actions.concat(chosen);
      if(!list.length) return;
      if(S.sheet.replace){ S.stop={}; S.go={}; S.limits={}; S.wstop={}; }
      list.forEach(r=>{
        const id=r.target.id;
        if(r.target.kind==='wine'){
          // у бутылок нет гоу и счётчика заказов: 0 — стоп, N — «осталось N»
          if(r.go) delete S.wstop[id];
          else S.wstop[id]=r.limit!=null?r.limit:0;
          return;
        }
        if(r.go){ S.go[id]=1; delete S.stop[id]; }
        if(r.stop){ S.stop[id]=1; delete S.go[id]; }
        if(r.limit!=null) S.limits[id]=r.limit;
      });
      const skipped=res.unknown.length+chooseLeft()+res.suggest.filter((r,i)=>!S.sheet.pick['s'+i]).length;
      save(); S.sheet=null; render();
      toast('Применено: '+list.length+(skipped?' · не распознано: '+skipped:''));
    };
  }

  document.body.appendChild(sc);
}

/* live timers: патчим только текст таймеров, не пересобираем весь DOM каждую
   секунду — раньше тут был полный render() экрана стола/зала 1×/сек, что на
   слабом телефоне ощутимо тормозило именно там, где важна скорость (см.
   CONTEXT.md, «на лету пробивать») */
function patchLiveTimers(){
  if(S.screen==='floor'){
    document.querySelectorAll('.tcell[data-table]').forEach(cell=>{
      const o=order(cell.dataset.table); if(!o) return;
      const span=cell.querySelector('.meta span:last-child');
      if(span) span.textContent=mmss(Date.now()-o.openedAt);
      // статус тоже патчим: порог «висит долго» наступает сам по времени, без
      // события от checkReady — иначе стол не покраснеет до следующей перерисовки
      const st=orderStatus(o), want='tcell '+(st==='free'?'':st);
      if(cell.className!==want) cell.className=want;
    });
    document.querySelectorAll('.rb-row[data-at]').forEach(row=>{
      const w=row.querySelector('.rb-w');
      if(w) w.textContent=mmss(Date.now()-(+row.dataset.at));
    });
  } else if(S.screen==='table'){
    const o=order(S.activeTable); if(!o) return;
    const elapsed=document.getElementById('tbl-elapsed');
    if(elapsed) elapsed.textContent=mmss(Date.now()-o.openedAt);
    document.querySelectorAll('.item[data-iid]').forEach(row=>{
      const i=o.items.find(x=>x.id===row.dataset.iid); if(!i) return;
      const {cls,tmr}=itemLiveState(i);
      row.className=`item ${cls} ${i.punchedAt?'sent':''}`;
      const body=row.querySelector('.body');
      const tmrEl=body.querySelector('.tmr');
      if(tmr){ const fresh=el(tmr); if(tmrEl) tmrEl.replaceWith(fresh); else body.appendChild(fresh); }
      else if(tmrEl) tmrEl.remove();
    });
  }
}
let lastTick=Date.now();
setInterval(()=>{
  const gap = Date.now()-lastTick; lastTick=Date.now();
  const changed = checkReady();
  if((S.sheet || S.menuOpen) && !changed) return;
  // gap > 20с значит приложение было свернуто — обновляем всё целиком
  if(changed || gap>20000) { render(); return; }
  if(S.screen==='floor' || S.screen==='table') patchLiveTimers();
},1000);

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){ unlockAudio(); checkReady(); render(); }
});

/* service worker (только на реальном хостинге): автообновление без залипания
   на старой версии — sw.js сам активируется сразу (skipWaiting/clients.claim),
   а тут перезагружаем страницу в момент смены контроллера */
if('serviceWorker' in navigator && location.protocol==='https:'){
  // updateViaCache:'none' — иначе браузер сам отдаёт закэшированный sw.js и до
  // суток не замечает, что вышла новая версия; это и есть главная причина,
  // почему PWA «не подтягивает обновление» без переустановки
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    reg.update().catch(()=>{});
    setInterval(()=>reg.update().catch(()=>{}), 30*60*1000);
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='visible') reg.update().catch(()=>{});
    });
  }).catch(()=>{});
  let swRefreshed=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(swRefreshed) return; swRefreshed=true; location.reload();
  });
}

boot();
</script>
