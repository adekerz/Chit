<style>
:root{
  --bg:#14161A; --bg2:#1B1E24; --bg3:#22262E;
  --paper:#FBF7EC; --ink:#211D16; --ink-dim:#6B6455;
  --line:#2A2E36; --muted:#59626F; --fg:#E7E5DF;
  --free:#3A414D; --busy:#2F7B4F; --precheck:#8C5A1A; --alert:#A9352C; --new:#4451A6;
  --sans:'IBM Plex Sans',-apple-system,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);overscroll-behavior:none}
body{display:flex;flex-direction:column}
button,input,textarea,select{font-family:inherit}
.topbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0}
.topbar h1{margin:0;font-size:15px;font-weight:600;flex:1;letter-spacing:.01em}
.topbar .sub{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.iconbtn{background:none;border:none;color:var(--fg);font-size:14px;padding:6px 8px;cursor:pointer;border-radius:4px}
.iconbtn:active{background:var(--bg3)}
.back{font-size:15px;color:var(--fg);background:none;border:none;padding:6px 4px 6px 0;cursor:pointer}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.bottom{flex-shrink:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line);display:flex;gap:8px}
.btn{flex:1;padding:14px;border:none;border-radius:5px;font-size:14.5px;font-weight:600;cursor:pointer;background:var(--fg);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.amber{background:var(--precheck);color:#fff}
.btn.green{background:var(--busy);color:#fff}
.btn:disabled{opacity:.35}
.hint{color:var(--muted);font-size:13px;line-height:1.6;text-align:center;padding:50px 24px}

/* floor grid */
.zone-title{font-size:12px;color:var(--muted);margin:14px 2px 8px;letter-spacing:.03em}
.zone-title:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tcell{aspect-ratio:1/.85;border-radius:6px;border:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;justify-content:space-between;padding:9px;cursor:pointer;position:relative;overflow:hidden}
.tcell .num{font-family:var(--mono);font-size:21px;font-weight:600;line-height:1}
.tcell .meta{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:flex-end}
.tcell.busy{background:rgba(47,123,79,.17);border-color:var(--busy)}
.tcell.busy .meta{color:#7FBF9A}
.tcell.precheck{background:rgba(140,90,26,.2);border-color:var(--precheck)}
.tcell.precheck .meta{color:#D2A05C}
.tcell.alert{background:rgba(169,53,44,.2);border-color:var(--alert)}
.tcell.alert .meta{color:#E0847C}
.badge{position:absolute;top:7px;right:7px;background:var(--new);color:#fff;font-family:var(--mono);font-size:10px;font-weight:600;border-radius:9px;padding:2px 6px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}

/* order screen */
.guesttabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:2px}
.gtab{flex-shrink:0;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);font-size:13px;cursor:pointer}
.gtab.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.gsec{margin-bottom:14px}
.gsec h3{font-size:12px;color:var(--muted);margin:0 0 6px 2px;font-weight:500;letter-spacing:.03em}
.item{background:var(--paper);color:var(--ink);border-radius:4px;border-left:4px solid var(--new);padding:10px 11px;margin-bottom:6px;display:flex;gap:10px;align-items:flex-start}
.item.punched{border-left-color:var(--busy)}
.item.late{border-left-color:var(--alert)}
.item.done{border-left-color:#B9B3A4;opacity:.65}
.item .body{flex:1;min-width:0;cursor:pointer}
.item .nm{font-size:14px;font-weight:500;line-height:1.3}
.item .qty{font-family:var(--mono);font-weight:600}

.flags{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.flag{width:34px;height:26px;border-radius:4px;border:1.5px solid #C9C2B0;background:transparent;color:var(--ink-dim);font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center}
.flag.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.flag:disabled{opacity:.3}
.sumline{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--muted);padding:10px 2px 4px;border-top:1px solid var(--line);margin-top:6px}
.sumline b{color:var(--fg);font-size:15px}

/* menu */
.search{width:100%;padding:12px 13px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;color:var(--fg);font-size:15px;margin-bottom:10px}
.search::placeholder{color:var(--muted)}
.cat{margin-bottom:6px}
.cat>.head{padding:11px 12px;background:var(--bg2);border-radius:5px;font-size:14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center}

.sub{padding:8px 0 2px 2px}
.sub>h4{font-size:11.5px;color:var(--muted);margin:6px 2px 5px;font-weight:500;letter-spacing:.03em}

.dish:active{background:var(--bg2)}
.dish .dn{flex:1;font-size:14px;line-height:1.3}
.dish .dp{font-family:var(--mono);font-size:13px;color:var(--muted)}
.dish .tag{font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;margin-left:6px;vertical-align:middle;display:inline-block}
.tag.stop{background:var(--alert);color:#fff}
.tag.go{background:var(--busy);color:#fff}
.tag.lim{background:var(--precheck);color:#fff;font-family:var(--mono)}
.tag.mod{background:var(--bg3);color:var(--muted)}
.dish.off{opacity:.34;pointer-events:none}
.crumb{font-size:11px;color:var(--muted);margin-top:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--bg2);border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet h2{margin:0 0 3px;font-size:17px;font-weight:600}
.sheet .sh-sub{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.field{margin-bottom:16px}
.field>label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
.field>label .req{color:var(--alert);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:9px 14px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:13.5px;cursor:pointer}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:20px;cursor:pointer}
.stepper .v{font-family:var(--mono);font-size:20px;font-weight:600;min-width:36px;text-align:center}
.sheet textarea,.sheet input[type=text],.sheet input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);font-size:15px;padding:11px;resize:none}
.sheet .acts{display:flex;gap:8px;margin-top:6px}
.rowbtn{width:100%;text-align:left;padding:14px 12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);font-size:14.5px;margin-bottom:7px;cursor:pointer}
.rowbtn.danger{color:#E0847C}

/* settings / stop */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:14px;font-weight:600}
.card p{margin:0 0 11px;font-size:12.5px;color:var(--muted);line-height:1.55}
.card textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:5px;color:var(--fg);font-family:var(--mono);font-size:13px;padding:10px;resize:vertical;min-height:120px}
.smallbtn{padding:10px 14px;border-radius:5px;border:none;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;cursor:pointer}
.smallbtn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.stoprow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.stoprow .sn{flex:1;font-size:13.5px;line-height:1.3}
.stoprow .sc{font-size:11px;color:var(--muted)}
.mini{padding:7px 10px;border-radius:5px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer}
.mini.stopon{background:var(--alert);border-color:var(--alert);color:#fff}
.mini.goon{background:var(--busy);border-color:var(--busy);color:#fff}
.limbox{width:52px;padding:7px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:13px;text-align:center}
.checkrow{display:flex;align-items:center;gap:11px;padding:13px 0;font-size:14.5px;cursor:pointer;border-bottom:1px solid var(--line)}
.checkrow input{width:21px;height:21px;accent-color:var(--busy)}

/* --- готовность --- */
.item .ct{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);border:1px solid #D6CFBD;border-radius:3px;padding:1px 4px;margin-left:6px;vertical-align:middle}
.item .tmr.ready{color:var(--alert);font-weight:600;letter-spacing:.02em}
.item.late{animation:pulseborder 1.6s ease-in-out infinite}
@keyframes pulseborder{0%,100%{border-left-color:var(--alert)}50%{border-left-color:#E0847C}}
@media (prefers-reduced-motion:reduce){.item.late{animation:none}}
.readybar{background:rgba(169,53,44,.16);border:1px solid var(--alert);border-radius:7px;padding:10px 12px;margin-bottom:14px}
.rb-h{font-size:12px;color:#E0847C;font-weight:600;letter-spacing:.03em;margin-bottom:7px}
.rb-row{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid rgba(169,53,44,.28);cursor:pointer}
.rb-row:first-of-type{border-top:none}
.rb-t{font-family:var(--mono);font-size:15px;font-weight:600;min-width:26px}
.rb-n{flex:1;font-size:13.5px;line-height:1.3}
.rb-w{font-family:var(--mono);font-size:12px;color:#E0847C}
.badge.rdy{background:var(--alert);font-size:9.5px}
.tag.time{background:var(--bg3);color:#9AA3B0;font-family:var(--mono)}
.chip-t{font-family:var(--mono);font-size:10.5px;opacity:.62;margin-left:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:22px;font-size:13.5px;font-weight:600;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<main id="main"></main>
<div class="bottom" id="bottom"></div>

<script>
/* ---------- storage adapter: works both in Claude artifacts and on a real host ---------- */
const store = {
  async get(k){
    try{
      if(window.storage){ const r = await window.storage.get(k,false); return r ? r.value : null; }
    }catch(e){ return null; }
    try{ return localStorage.getItem(k); }catch(e){ return null; }
  },
  async set(k,v){
    try{
      if(window.storage){ await window.storage.set(k,v,false); return; }
    }catch(e){}
    try{ localStorage.setItem(k,v); }catch(e){}
  }
};

/* ---------- default menu (replace in settings) ---------- */
const DEFAULT_MENU = `# Кухня
## Салаты
Цезарь с курицей | 3200 | ~7 | ?добавка: пармезан, анчоусы
Греческий | 2800 | ~5
Салат с тунцом | 3900 | ~7
## Супы
Том ям | 4100 | ~14 | ?острота: не острый, средний, острый
Куриный бульон | 1900 | ~8
Крем-суп грибной | 2600 | ~10
## Горячее
Стейк рибай | 12900 | ~16 | !прожарка: rare~12, medium rare~14, medium~16, medium well~19, well done~22 | ?соус: перечный, грибной, без соуса
Стейк стриплойн | 9800 | ~15 | !прожарка: rare~11, medium rare~13, medium~15, medium well~18, well done~21
Паста карбонара | 3600 | ~12
Лосось на гриле | 7400 | ~15 | ?гарнир: овощи, рис, картофель
Бургер классический | 4200 | ~13 | !прожарка котлеты: medium~12, well done~15 | ?добавка: бекон, сыр, халапеньо
## Гарниры
Картофель фри | 1400 | ~7
Овощи гриль | 1800 | ~9
Рис | 1100 | ~5

# Бар
## Кофе
Эспрессо | 900 | ~2
Американо | 1100 | ~2 | ?молоко: без молока, обычное, растительное
Капучино | 1500 | ~3 | ?молоко: обычное, растительное | ?сироп: карамель, ваниль, лесной орех, без сиропа
Латте | 1600 | ~3 | ?молоко: обычное, растительное | ?сироп: карамель, ваниль, лесной орех, без сиропа
Раф | 1800 | ~4 | ?сироп: карамель, ваниль, без сиропа
## Чай
Черный | 1200 | ~4
Зеленый | 1200 | ~4
Облепиховый | 1900 | ~5
## Напитки
Лимонад домашний | 1600 | ~4 | ?вкус: мохито, малина, тархун
Вода без газа | 700 | ~1
Вода с газом | 700 | ~1
Свежевыжатый сок | 2400 | ~4 | !вид: апельсин, яблоко, грейпфрут

# Десерты
Чизкейк | 2600 | ~3
Наполеон | 2400 | ~3
Мороженое | 1500 | ~2 | ?вкус: ванильное, шоколадное, фисташковое`;

const DEFAULT_TABLES = `Основной зал: 1,2,3,4,5,6,7,8
Терраса: 21,22,23,24
Бар: 31,32`;

/* ---------- state ---------- */
let S = {
  screen:'floor', activeTable:null, activeGuest:1,
  menuText:DEFAULT_MENU, tablesText:DEFAULT_TABLES,
  orders:{}, stop:{}, go:{}, limits:{},
  query:'', openCats:{}, sheet:null, toast:null,
  lateMin:12, sound:true, defaultCook:0, ready:[]
};
let menu = {cats:[], dishes:[]};

/* ---------- menu parsing ---------- */
function slug(s){ return s.toLowerCase().replace(/[^a-zа-яё0-9]+/gi,'-'); }
function parseMenu(text){
  const cats=[], dishes=[]; let cat=null, sub=null;
  text.split('\n').forEach(raw=>{
    const line=raw.trim();
    if(!line||line.startsWith('//')) return;
    if(line.startsWith('## ')){
      if(!cat){cat={name:'Меню',subs:[]};cats.push(cat);}
      sub={name:line.slice(3).trim(),dishes:[]}; cat.subs.push(sub); return;
    }
    if(line.startsWith('# ')){
      cat={name:line.slice(2).trim(),subs:[]}; cats.push(cat); sub=null; return;
    }
    const parts=line.split('|').map(p=>p.trim());
    const name=parts[0]; if(!name) return;
    const price=parts[1]?parseInt(parts[1].replace(/\D/g,''),10)||0:0;
    const mods=[]; let cook=null;
    for(let i=2;i<parts.length;i++){
      let p=parts[i]; if(!p) continue;
      if(p.startsWith('~')){ cook=parseFloat(p.slice(1).replace(',','.'))||null; continue; }
      let required=false;
      if(p.startsWith('!')){required=true;p=p.slice(1);}
      else if(p.startsWith('?')){p=p.slice(1);}
      const ci=p.indexOf(':'); if(ci<0) continue;
      const gname=p.slice(0,ci).trim();
      const opts=p.slice(ci+1).split(',').map(o=>{
        const t=o.trim(); if(!t) return null;
        const ti=t.lastIndexOf('~');
        if(ti>0) return {label:t.slice(0,ti).trim(), cook:parseFloat(t.slice(ti+1).replace(',','.'))||null};
        return {label:t, cook:null};
      }).filter(Boolean);
      if(gname&&opts.length) mods.push({name:gname,required,options:opts});
    }
    if(!cat){cat={name:'Меню',subs:[]};cats.push(cat);}
    if(!sub){sub={name:'',dishes:[]};cat.subs.push(sub);}
    const d={id:slug(name),name,price,mods,cook,cat:cat.name,sub:sub.name};
    sub.dishes.push(d); dishes.push(d);
  });
  return {cats,dishes};
}
function parseTables(text){
  const zones=[];
  text.split('\n').forEach(raw=>{
    const line=raw.trim(); if(!line) return;
    const ci=line.indexOf(':');
    const zname = ci>=0 ? line.slice(0,ci).trim() : '';
    const nums = (ci>=0?line.slice(ci+1):line).split(',').map(n=>n.trim()).filter(Boolean);
    if(nums.length) zones.push({name:zname,tables:nums});
  });
  return zones;
}

/* ---------- search: substring OR subsequence ("кпч" -> капучино) ---------- */
function matches(name,q){
  if(!q) return true;
  const n=name.toLowerCase(), s=q.toLowerCase().trim();
  if(n.includes(s)) return true;
  const words=s.split(/\s+/);
  if(words.length>1 && words.every(w=>n.includes(w))) return true;
  let i=0; for(const ch of n){ if(ch===s[i]) i++; if(i===s.length) return true; }
  return false;
}

/* ---------- helpers ---------- */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function order(t){ return S.orders[t]; }
function usedCount(dishId){
  let n=0;
  Object.values(S.orders).forEach(o=>o.items.forEach(i=>{ if(i.dishId===dishId) n+=i.qty; }));
  return n;
}
function remaining(dishId){
  const lim=S.limits[dishId];
  if(lim===undefined||lim===null||lim==='') return null;
  return lim - usedCount(dishId);
}
function dishAvailable(d){
  if(S.stop[d.id]) return false;
  const r=remaining(d.id);
  return !(r!==null && r<=0);
}
function money(n){ return n.toLocaleString('ru-RU'); }
function mmss(ms){
  const s=Math.max(0,Math.floor(ms/1000)), m=Math.floor(s/60);
  if(m<60) return m+':'+String(s%60).padStart(2,'0');
  return Math.floor(m/60)+' ч '+(m%60)+' м';
}
function orderStatus(o){
  if(!o) return 'free';
  const now=Date.now();
  const ready=o.items.some(i=>isReady(i));
  if(ready) return 'alert';
  const late=o.items.some(i=>i.punchedAt&&!i.cook&&!i.delivered&&(now-i.punchedAt)>S.lateMin*60000);
  if(late) return 'alert';
  if(o.status==='precheck') return 'precheck';
  return 'busy';
}
function readyCount(o){ return o?o.items.filter(i=>isReady(i)).length:0; }
function unpunched(o){ return o?o.items.filter(i=>!i.punchedAt).reduce((a,i)=>a+i.qty,0):0; }
function total(o){ return o?o.items.reduce((a,i)=>a+i.price*i.qty,0):0; }

/* ---------- cook time ---------- */
function cookMinutes(dish, sel){
  let best = dish.cook;
  (dish.mods||[]).forEach(g=>{
    const chosen = sel && sel[g.name];
    if(!chosen) return;
    const opt = g.options.find(o=>o.label===chosen);
    if(opt && opt.cook!=null) best = opt.cook;   // прожарка переопределяет базовое время
  });
  if(best==null && S.defaultCook>0) best = S.defaultCook;
  return best;
}
function readyAt(i){ return (i.punchedAt && i.cook) ? i.punchedAt + i.cook*60000 : null; }
function isReady(i){ const r=readyAt(i); return !!(r && !i.delivered && Date.now()>=r); }
function readyItems(){
  const out=[];
  Object.values(S.orders).forEach(o=>o.items.forEach(i=>{ if(isReady(i)) out.push({o,i,at:readyAt(i)}); }));
  return out.sort((a,b)=>a.at-b.at);
}

/* ---------- alerts: звук + вибро + системное уведомление ---------- */
let audioCtx=null;
function unlockAudio(){
  if(audioCtx) { if(audioCtx.state==='suspended') audioCtx.resume(); return; }
  try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
document.addEventListener('touchstart', unlockAudio, {once:false});
document.addEventListener('click', unlockAudio, {once:false});

function beep(){
  if(!S.sound || !audioCtx) return;
  try{
    if(audioCtx.state==='suspended') audioCtx.resume();
    const now=audioCtx.currentTime;
    [0,0.18].forEach((off,k)=>{
      const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
      osc.type='sine'; osc.frequency.value = k? 1046 : 784;
      g.gain.setValueAtTime(0,now+off);
      g.gain.linearRampToValueAtTime(0.32,now+off+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,now+off+0.16);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(now+off); osc.stop(now+off+0.18);
    });
  }catch(e){}
}
function notify(title, body){
  try{ if(navigator.vibrate) navigator.vibrate([120,60,120]); }catch(e){}
  beep();
  try{
    if('Notification' in window && Notification.permission==='granted'){
      new Notification(title,{body,tag:'floor-'+Date.now(),icon:'icon-192.png'});
    }
  }catch(e){}
}

/* проверка готовности: помечает и оповещает один раз на позицию */
function checkReady(){
  let changed=false, fresh=[];
  Object.values(S.orders).forEach(o=>o.items.forEach(i=>{
    if(i.notified||i.delivered) return;
    const r=readyAt(i);
    if(r && Date.now()>=r){ i.notified=true; changed=true; fresh.push({o,i}); }
  }));
  if(fresh.length){
    save();
    if(fresh.length===1){
      const f=fresh[0];
      notify('Готово · стол '+f.o.table, f.i.name+' — забрать');
    } else {
      notify('Готово: '+fresh.length+' поз.', fresh.map(f=>'ст.'+f.o.table+' '+f.i.name).join(', '));
    }
  }
  return changed;
}

/* ---------- persistence ---------- */
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    store.set('floor-v2',JSON.stringify({
      menuText:S.menuText,tablesText:S.tablesText,orders:S.orders,
      stop:S.stop,go:S.go,limits:S.limits,lateMin:S.lateMin,sound:S.sound,defaultCook:S.defaultCook
    }));
  },250);
}
async function boot(){
  const raw=await store.get('floor-v2');
  if(raw){ try{ Object.assign(S,JSON.parse(raw)); }catch(e){} }
  menu=parseMenu(S.menuText);
  render();
}

/* ---------- toast ---------- */
let toastT=null;
function toast(msg){
  S.toast=msg; render();
  clearTimeout(toastT);
  toastT=setTimeout(()=>{S.toast=null;render();},1400);
}

/* ---------- actions ---------- */
function openTable(num,guests){
  S.orders[num]={table:num,guests,items:[],openedAt:Date.now(),status:'open',
    checks:{precheck:false,paid:false,cleared:false}};
  S.activeTable=num; S.activeGuest=1; S.screen='table'; S.sheet=null; save(); render();
}
function addItem(d,guest,qty,mods,comment){
  const o=order(S.activeTable); if(!o) return;
  o.items.push({id:uid(),dishId:d.id,name:d.name,price:d.price,qty,guest,mods:mods||{},
    comment:comment||'',punchedAt:null,delivered:false,
    cook:cookMinutes(d,mods||{}),notified:false});
  save();
}
function punchAll(){
  const o=order(S.activeTable); if(!o) return;
  const now=Date.now(); let n=0;
  o.items.forEach(i=>{ if(!i.punchedAt){i.punchedAt=now;i.notified=false;n++;} });
  save(); render(); if(n) toast('Пробито позиций: '+n);
}

/* ================= RENDER ================= */
function render(){
  const tb=document.getElementById('topbar'), mn=document.getElementById('main'), bt=document.getElementById('bottom');
  document.querySelectorAll('.scrim,.toast').forEach(e=>e.remove());
  if(S.screen==='floor') renderFloor(tb,mn,bt);
  else if(S.screen==='table') renderTable(tb,mn,bt);
  else if(S.screen==='menu') renderMenu(tb,mn,bt);
  else if(S.screen==='stop') renderStop(tb,mn,bt);
  else if(S.screen==='settings') renderSettings(tb,mn,bt);
  if(S.sheet) renderSheet();
  if(S.toast){ const t=document.createElement('div'); t.className='toast'; t.textContent=S.toast; document.body.appendChild(t); }
}
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

/* --- table order --- */
function renderTable(tb,mn,bt){
  bt.style.display='flex';
  const o=order(S.activeTable);
  if(!o){ S.screen='floor'; render(); return; }
  tb.innerHTML=`<button class="back" id="bk">‹ Зал</button>
    <h1>Стол ${esc(o.table)} <span class="sub">${o.guests} гост. · ${mmss(Date.now()-o.openedAt)}</span></h1>
    <button class="iconbtn" id="gplus">+гость</button>`;
  tb.querySelector('#bk').onclick=()=>{S.screen='floor';render();};
  tb.querySelector('#gplus').onclick=()=>{o.guests++;save();render();};

  mn.innerHTML='';
  const tabs=el('<div class="guesttabs"></div>');
  const all=el(`<button class="gtab ${S.activeGuest==='all'?'on':''}">Все</button>`);
  all.onclick=()=>{S.activeGuest='all';render();};
  tabs.appendChild(all);
  for(let g=1;g<=o.guests;g++){
    const cnt=o.items.filter(i=>i.guest===g).length;
    const b=el(`<button class="gtab ${S.activeGuest===g?'on':''}">Г${g}${cnt?' · '+cnt:''}</button>`);
    b.onclick=()=>{S.activeGuest=g;render();};
    tabs.appendChild(b);
  }
  mn.appendChild(tabs);

  if(!o.items.length){
    mn.appendChild(el('<div class="hint">Заказ пуст.<br>Нажми «+ Блюдо» и выбирай со слов гостя.</div>'));
  } else {
    const groups = S.activeGuest==='all' ? Array.from({length:o.guests},(_,i)=>i+1) : [S.activeGuest];
    groups.forEach(g=>{
      const items=o.items.filter(i=>i.guest===g);
      if(!items.length && S.activeGuest==='all') return;
      const sec=el(`<div class="gsec"><h3>Гость ${g}${items.length?' — '+money(items.reduce((a,i)=>a+i.price*i.qty,0))+' ₸':''}</h3></div>`);
      if(!items.length) sec.appendChild(el('<div class="hint" style="padding:14px;font-size:12.5px">нет позиций</div>'));
      items.forEach(i=>sec.appendChild(itemRow(i)));
      mn.appendChild(sec);
    });
  }
  const up=unpunched(o);
  mn.appendChild(el(`<div class="sumline"><span>${up?('не пробито: '+up):'всё пробито'}</span><b>${money(total(o))} ₸</b></div>`));

  bt.innerHTML='';
  const addB=el('<button class="btn">+ Блюдо</button>');
  addB.onclick=()=>{S.screen='menu';S.query='';render();};
  bt.appendChild(addB);
  if(up){
    const pb=el('<button class="btn green">Пробить всё</button>');
    pb.onclick=punchAll; bt.appendChild(pb);
  } else {
    const cb=el(`<button class="btn ${o.status==='precheck'?'ghost':'amber'}">${o.status==='precheck'?'Закрыть стол':'Пречек'}</button>`);
    cb.onclick=()=>{
      if(o.status!=='precheck'){ o.status='precheck'; o.precheckAt=Date.now(); o.checks.precheck=true; save(); render(); }
      else { S.sheet={type:'close'}; render(); }
    };
    bt.appendChild(cb);
  }
}
function itemRow(i){
  const now=Date.now();
  const r=readyAt(i), ready=isReady(i);
  const lateNoCook = i.punchedAt && !i.cook && !i.delivered && (now-i.punchedAt)>S.lateMin*60000;
  const cls = i.delivered?'done':(ready||lateNoCook?'late':(i.punchedAt?'punched':''));
  const mods=Object.entries(i.mods||{}).map(([k,v])=>`${esc(k)}: <b>${esc(v)}</b>`).join(' · ');
  let tmr='';
  if(i.punchedAt && !i.delivered){
    if(r && ready) tmr=`<div class="tmr ready">ГОТОВО · ждёт ${mmss(now-r)}</div>`;
    else if(r) tmr=`<div class="tmr">готово через ${mmss(r-now)}</div>`;
    else tmr=`<div class="tmr ${lateNoCook?'late':''}">на кухне ${mmss(now-i.punchedAt)}</div>`;
  }
  const row=el(`<div class="item ${cls}" data-iid="${i.id}">
    <div class="body">
      <div class="nm"><span class="qty">${i.qty}×</span> ${esc(i.name)}${i.cook?`<span class="ct">${i.cook}м</span>`:''}</div>
      ${mods?`<div class="det">${mods}</div>`:''}
      ${i.comment?`<div class="det">💬 ${esc(i.comment)}</div>`:''}
      ${tmr}
    </div>
    <div class="flags">
      <button class="flag ${i.punchedAt?'on':''}" data-a="p">П</button>
      <button class="flag ${i.delivered?'on':''}" data-a="d" ${i.punchedAt?'':'disabled'}>О</button>
    </div>
  </div>`);
  row.querySelector('.body').onclick=()=>{S.sheet={type:'item',itemId:i.id};render();};
  row.querySelector('[data-a="p"]').onclick=()=>{
    if(i.punchedAt){i.punchedAt=null;i.delivered=false;i.notified=false;} else {i.punchedAt=Date.now();i.notified=false;}
    save();render();
  };
  row.querySelector('[data-a="d"]').onclick=()=>{ i.delivered=!i.delivered; save(); render(); };
  return row;
}

function renderMenu(tb,mn,bt){

  tb.innerHTML=`<button class="back" id="bk">‹ Стол ${esc(S.activeTable)}</button>
    <h1>Меню <span class="sub">→ Г${S.activeGuest==='all'?1:S.activeGuest}</span></h1>`;

  mn.innerHTML='';

  inp.oninput=e=>{S.query=e.target.value;renderMenuList(list);};
  mn.appendChild(inp);

  renderMenuList(list);
  if(S.query){ setTimeout(()=>{inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);},0); }

function dishRow(d,showCrumb){
  const r=remaining(d.id), stopped=S.stop[d.id], ok=dishAvailable(d);
  const tags=[];
  if(stopped) tags.push('<span class="tag stop">стоп</span>');
  if(S.go[d.id]) tags.push('<span class="tag go">гоу</span>');
  if(r!==null&&!stopped) tags.push(`<span class="tag lim">ост. ${Math.max(0,r)}</span>`);
  if(d.mods.some(m=>m.required)) tags.push('<span class="tag mod">мод</span>');
  if(d.cook) tags.push(`<span class="tag time">${d.cook}м</span>`);
  const row=el(`<div class="dish ${ok?'':'off'}">
    <div class="dn">${esc(d.name)}${tags.join('')}
      ${showCrumb?`<div class="crumb">${esc(d.cat)}${d.sub?' · '+esc(d.sub):''}</div>`:''}
    </div>
    <div class="dp">${d.price?money(d.price):''}</div>
  </div>`);
  if(ok) row.onclick=()=>pickDish(d);
  return row;
}
function renderMenuList(container){
  container.innerHTML='';
  if(S.query.trim()){
    const found=menu.dishes.filter(d=>matches(d.name,S.query)).slice(0,40);
    if(!found.length){ container.appendChild(el('<div class="hint">Ничего не нашлось</div>')); return; }
    found.forEach(d=>container.appendChild(dishRow(d,true)));
    return;
  }
  const gos=menu.dishes.filter(d=>S.go[d.id]&&dishAvailable(d));
  if(gos.length){
    container.appendChild(el('<div class="zone-title">Гоу-лист</div>'));
    gos.forEach(d=>container.appendChild(dishRow(d,true)));
  }
  menu.cats.forEach(c=>{
    const open=!!S.openCats[c.name];
    const box=el(`<div class="cat"><div class="head">${esc(c.name)}<span class="chev">${open?'▾':'▸'}</span></div></div>`);
    box.querySelector('.head').onclick=()=>{S.openCats[c.name]=!open;renderMenuList(container);};
    if(open){
      c.subs.forEach(s=>{
        const sb=el('<div class="sub"></div>');
        if(s.name) sb.appendChild(el(`<h4>${esc(s.name)}</h4>`));
        s.dishes.forEach(d=>sb.appendChild(dishRow(d,false)));
        box.appendChild(sb);
      });
    }
    container.appendChild(box);
  });
}
function pickDish(d){
  const guest = S.activeGuest==='all'?1:S.activeGuest;
  if(d.mods.length){ S.sheet={type:'mods',dish:d,guest,qty:1,sel:{},comment:''}; render(); return; }
  addItem(d,guest,1,{},'');
  toast(d.name+' → Г'+guest);
}

/* --- stop list screen --- */
function renderStop(tb,mn,bt){
  bt.style.display='flex';
  tb.innerHTML=`<button class="back" id="bk">‹ Зал</button><h1>Стоп / гоу / лимиты</h1>`;

  inp.oninput=e=>{S.query=e.target.value;fill();};
  mn.appendChild(inp);
  const list=el('<div></div>'); mn.appendChild(list);
  function fill(){
    list.innerHTML='';
    const src = S.query.trim()
      ? menu.dishes.filter(d=>matches(d.name,S.query))
      : menu.dishes.filter(d=>S.stop[d.id]||S.go[d.id]||S.limits[d.id]!==undefined);
    if(!src.length){
      list.appendChild(el('<div class="hint">Ограничений нет.<br>Найди блюдо в поиске и поставь стоп, гоу или лимит на смену.</div>'));
      return;
    }
    src.slice(0,60).forEach(d=>{
      const r=remaining(d.id);
      const row=el(`<div class="stoprow">
        <div class="sn">${esc(d.name)}<div class="sc">${esc(d.cat)}${d.sub?' · '+esc(d.sub):''}${r!==null?' · осталось '+Math.max(0,r):''}</div></div>
        <input class="limbox" placeholder="лим" value="${S.limits[d.id]!==undefined?S.limits[d.id]:''}">
        <button class="mini ${S.go[d.id]?'goon':''}" data-a="go">ГОУ</button>
        <button class="mini ${S.stop[d.id]?'stopon':''}" data-a="stop">СТОП</button>
      </div>`);
      row.querySelector('[data-a="stop"]').onclick=()=>{
        if(S.stop[d.id]) delete S.stop[d.id]; else {S.stop[d.id]=1; delete S.go[d.id];}
        save();fill();
      };
      row.querySelector('[data-a="go"]').onclick=()=>{
        if(S.go[d.id]) delete S.go[d.id]; else {S.go[d.id]=1; delete S.stop[d.id];}
        save();fill();
      };
      const lb=row.querySelector('.limbox');
      lb.onchange=()=>{
        const v=lb.value.trim();
        if(v==='') delete S.limits[d.id]; else S.limits[d.id]=parseInt(v,10)||0;
        save();fill();
      };
      list.appendChild(row);
    });
  }
  fill();
  if(S.query) setTimeout(()=>{inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);},0);
  bt.innerHTML='';
  const clr=el('<button class="btn ghost">Снять все стопы</button>');
  clr.onclick=()=>{ if(confirm('Снять все стопы и лимиты?')){S.stop={};S.limits={};save();fill();} };
  bt.appendChild(clr);
}

  </div>`);
  lcard.querySelector('#lm').onclick=()=>{S.lateMin=Math.max(3,S.lateMin-1);save();render();};
  lcard.querySelector('#lp').onclick=()=>{S.lateMin=Math.min(60,S.lateMin+1);save();render();};
  mn.appendChild(lcard);

  const perm = ('Notification' in window) ? Notification.permission : 'unsupported';
  const ncard=el(`<div class="card">
    <h3>Оповещения о готовности</h3>
    <p>Когда истекает время готовки блюда — звук, вибрация и системный баннер.
    Пока приложение открыто, срабатывает точно в срок. Если телефон заблокирован,
    iOS останавливает таймеры: всё, что доспело, покажется списком сразу при возврате в приложение.</p>
    <div class="checkrow" style="border:none;padding:6px 0">
      <input type="checkbox" id="snd" ${S.sound?'checked':''}> Звук и вибрация
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <button class="smallbtn ${perm==='granted'?'ghost':''}" id="np" ${perm==='granted'||perm==='unsupported'?'disabled':''}>
        ${perm==='granted'?'Уведомления разрешены':(perm==='denied'?'Запрещены в настройках iOS':(perm==='unsupported'?'Не поддерживается':'Разрешить уведомления'))}
      </button>
      <button class="smallbtn ghost" id="nt">Проверить сигнал</button>
    </div>
    <p style="margin:11px 0 0">Системные баннеры на iPhone работают только если приложение
    установлено на домашний экран через Safari.</p>
  </div>`);
  ncard.querySelector('#snd').onchange=e=>{S.sound=e.target.checked;save();};
  ncard.querySelector('#np').onclick=()=>{
    unlockAudio();
    if('Notification' in window) Notification.requestPermission().then(()=>render());
  };
  ncard.querySelector('#nt').onclick=()=>{ unlockAudio(); notify('Проверка','Так выглядит сигнал о готовности'); };
  mn.appendChild(ncard);

  const ccard=el(`<div class="card">
    <h3>Время готовки по умолчанию</h3>
    <p>Для блюд, у которых в меню не указано <b>~минуты</b>. Ноль — не считать готовность, только время с пробития.</p>
    <div class="stepper">
      <button id="dm">−</button><span class="v">${S.defaultCook||'выкл'}</span><button id="dp">+</button>
      <span style="color:var(--muted);font-size:13px">минут</span>
    </div>
  </div>`);
  ccard.querySelector('#dm').onclick=()=>{S.defaultCook=Math.max(0,S.defaultCook-1);save();render();};
  ccard.querySelector('#dp').onclick=()=>{S.defaultCook=Math.min(60,S.defaultCook+1);save();render();};
  mn.appendChild(ccard);

  const dcard=el(`<div class="card">
    <h3>Смена</h3>
    <p>Закрыть все столы разом в конце смены. Меню, карта зала и настройки останутся.</p>
    <button class="smallbtn ghost" id="rs">Очистить все столы</button>
  </div>`);
  dcard.querySelector('#rs').onclick=()=>{
    if(confirm('Закрыть все столы?')){ S.orders={}; save(); toast('Смена очищена'); render(); }
  };
  mn.appendChild(dcard);
}

/* --- sheets --- */
function renderSheet(){
  const sc=el('<div class="scrim"></div>');
  const sh=el('<div class="sheet"></div>');
  sc.appendChild(sh);
  sc.onclick=e=>{ if(e.target===sc){S.sheet=null;render();} };
  const t=S.sheet.type;

  if(t==='open'){
    sh.appendChild(el(`<h2>Стол ${esc(S.sheet.table)}</h2><div class="sh-sub">Сколько гостей?</div>`));
    const f=el('<div class="field"><div class="stepper"><button id="m">−</button><span class="v" id="v"></span><button id="p">+</button></div></div>');
    f.querySelector('#v').textContent=S.sheet.guests;
    f.querySelector('#m').onclick=()=>{S.sheet.guests=Math.max(1,S.sheet.guests-1);render();};
    f.querySelector('#p').onclick=()=>{S.sheet.guests=Math.min(20,S.sheet.guests+1);render();};
    sh.appendChild(f);
    const acts=el('<div class="acts"></div>');
    const c=el('<button class="btn ghost">Отмена</button>'); c.onclick=()=>{S.sheet=null;render();};
    const k=el('<button class="btn">Открыть заказ</button>'); k.onclick=()=>openTable(S.sheet.table,S.sheet.guests);
    acts.append(c,k); sh.appendChild(acts);
  }

  else if(t==='mods'){
    const d=S.sheet.dish;
    const cm=cookMinutes(d,S.sheet.sel);
    sh.appendChild(el(`<h2>${esc(d.name)}</h2><div class="sh-sub">${d.price?money(d.price)+' ₸ · ':''}${esc(d.cat)}${cm?' · готовится '+cm+' мин':''}</div>`));
    d.mods.forEach(g=>{
      const f=el(`<div class="field"><label>${esc(g.name)}${g.required?'<span class="req">обязательно</span>':''}</label><div class="chips"></div></div>`);
      const ch=f.querySelector('.chips');
      g.options.forEach(o=>{
        const b=el(`<button class="chip ${S.sheet.sel[g.name]===o.label?'on':''}">${esc(o.label)}${o.cook?`<span class="chip-t">${o.cook}м</span>`:''}</button>`);
        b.onclick=()=>{
          if(S.sheet.sel[g.name]===o.label && !g.required) delete S.sheet.sel[g.name];
          else S.sheet.sel[g.name]=o.label;
          render();
        };
        ch.appendChild(b);
      });
      sh.appendChild(f);
    });
    const gf=el('<div class="field"><label>Гость</label><div class="chips"></div></div>');
    const o=order(S.activeTable);
    for(let g=1;g<=(o?o.guests:1);g++){
      const b=el(`<button class="chip ${S.sheet.guest===g?'on':''}">Г${g}</button>`);
      b.onclick=()=>{S.sheet.guest=g;render();};
      gf.querySelector('.chips').appendChild(b);
    }
    sh.appendChild(gf);
    const qf=el('<div class="field"><label>Количество</label><div class="stepper"><button id="m">−</button><span class="v" id="v"></span><button id="p">+</button></div></div>');
    qf.querySelector('#v').textContent=S.sheet.qty;
    qf.querySelector('#m').onclick=()=>{S.sheet.qty=Math.max(1,S.sheet.qty-1);render();};
    qf.querySelector('#p').onclick=()=>{S.sheet.qty++;render();};
    sh.appendChild(qf);
    const cf=el(`<div class="field"><label>Комментарий</label><textarea id="cm" rows="2" placeholder="без лука, подать позже...">${esc(S.sheet.comment)}</textarea></div>`);
    sh.appendChild(cf);
    const missing=d.mods.filter(m=>m.required&&!S.sheet.sel[m.name]);
    const acts=el('<div class="acts"></div>');
    const c=el('<button class="btn ghost">Отмена</button>'); c.onclick=()=>{S.sheet=null;render();};
    const k=el(`<button class="btn" ${missing.length?'disabled':''}>${missing.length?'Выбери: '+esc(missing[0].name):'Добавить'}</button>`);
    k.onclick=()=>{
      addItem(d,S.sheet.guest,S.sheet.qty,S.sheet.sel,cf.querySelector('#cm').value.trim());
      const nm=d.name, g=S.sheet.guest; S.sheet=null; render(); toast(nm+' → Г'+g);
    };
    acts.append(c,k); sh.appendChild(acts);
  }

  else if(t==='item'){
    const o=order(S.activeTable);
    const i=o.items.find(x=>x.id===S.sheet.itemId);
    if(!i){S.sheet=null;render();return;}
    sh.appendChild(el(`<h2>${esc(i.name)}</h2><div class="sh-sub">Гость ${i.guest} · ${i.qty} шт · ${money(i.price*i.qty)} ₸${i.cook?' · '+i.cook+' мин':''}</div>`));

    const cf2=el(`<div class="field"><label>Время готовки, мин</label><div class="stepper">
      <button id="cm-">−</button><span class="v" id="cm-v">${i.cook||'—'}</span><button id="cm+">+</button>
      <span style="color:var(--muted);font-size:12.5px">меняет отсчёт до готовности</span></div></div>`);
    cf2.querySelector('#cm-').onclick=()=>{ i.cook=Math.max(0,(i.cook||0)-1)||null; i.notified=false; save(); render(); };
    cf2.querySelector('#cm+').onclick=()=>{ i.cook=(i.cook||0)+1; i.notified=false; save(); render(); };
    sh.appendChild(cf2);

    const qf=el('<div class="field"><label>Количество</label><div class="stepper"><button id="m">−</button><span class="v" id="v"></span><button id="p">+</button></div></div>');
    qf.querySelector('#v').textContent=i.qty;
    qf.querySelector('#m').onclick=()=>{ if(i.qty>1){i.qty--;save();render();} };
    qf.querySelector('#p').onclick=()=>{i.qty++;save();render();};
    sh.appendChild(qf);

    const d=menu.dishes.find(x=>x.id===i.dishId);
    if(d) d.mods.forEach(g=>{
      const f=el(`<div class="field"><label>${esc(g.name)}</label><div class="chips"></div></div>`);
      g.options.forEach(op=>{
        const b=el(`<button class="chip ${i.mods[g.name]===op.label?'on':''}">${esc(op.label)}${op.cook?`<span class="chip-t">${op.cook}м</span>`:''}</button>`);
        b.onclick=()=>{ i.mods[g.name]=op.label; i.cook=cookMinutes(d,i.mods); i.notified=false; save(); render(); };
        f.querySelector('.chips').appendChild(b);
      });
      sh.appendChild(f);
    });

    const cf=el(`<div class="field"><label>Комментарий</label><textarea id="cm" rows="2" placeholder="без лука...">${esc(i.comment)}</textarea></div>`);
    cf.querySelector('#cm').onchange=e=>{i.comment=e.target.value.trim();save();};
    sh.appendChild(cf);

    const gf=el('<div class="field"><label>Передать гостю</label><div class="chips"></div></div>');
    for(let g=1;g<=o.guests;g++){
      const b=el(`<button class="chip ${i.guest===g?'on':''}">Г${g}</button>`);
      b.onclick=()=>{ i.guest=g; save(); S.sheet=null; render(); toast('Передано Г'+g); };
      gf.querySelector('.chips').appendChild(b);
    }
    sh.appendChild(gf);

    const moveF=el('<div class="field"><label>Перенести на стол</label><div class="chips"></div></div>');
    const others=Object.keys(S.orders).filter(t2=>t2!==S.activeTable);
    if(!others.length) moveF.querySelector('.chips').appendChild(el('<span style="color:var(--muted);font-size:13px">других открытых столов нет</span>'));
    others.forEach(t2=>{
      const b=el(`<button class="chip">Стол ${esc(t2)}</button>`);
      b.onclick=()=>{
        const dst=S.orders[t2];
        o.items=o.items.filter(x=>x.id!==i.id);
        i.guest=1; dst.items.push(i); save(); S.sheet=null; render(); toast('Перенесено на стол '+t2);
      };
      moveF.querySelector('.chips').appendChild(b);
    });
    sh.appendChild(moveF);

    const del=el('<button class="rowbtn danger">Удалить позицию</button>');
    del.onclick=()=>{ o.items=o.items.filter(x=>x.id!==i.id); save(); S.sheet=null; render(); toast('Удалено'); };
    sh.appendChild(del);
    const cl=el('<button class="btn ghost" style="width:100%">Готово</button>');
    cl.onclick=()=>{S.sheet=null;render();};
    sh.appendChild(cl);
  }

  else if(t==='close'){
    const o=order(S.activeTable);
    sh.appendChild(el(`<h2>Закрытие стола ${esc(o.table)}</h2><div class="sh-sub">${money(total(o))} ₸ · ${o.guests} гост. · ${mmss(Date.now()-o.openedAt)}</div>`));
    const undel=o.items.filter(i=>!i.delivered).length;
    if(undel) sh.appendChild(el(`<div class="field" style="color:#E0847C;font-size:13px">Не отмечено отданными: ${undel} поз.</div>`));
    const rows=[['precheck','Пречек распечатан и отдан'],['paid','Гость оплатил'],['cleared','Стол убран']];
    rows.forEach(([k,label])=>{
      const r=el(`<label class="checkrow"><input type="checkbox" ${o.checks[k]?'checked':''}> ${label}</label>`);
      r.querySelector('input').onchange=()=>{o.checks[k]=!o.checks[k];save();render();};
      sh.appendChild(r);
    });
    const ready=o.checks.precheck&&o.checks.paid&&o.checks.cleared;
    const acts=el('<div class="acts" style="margin-top:16px"></div>');
    const c=el('<button class="btn ghost">Не сейчас</button>'); c.onclick=()=>{S.sheet=null;render();};
    const k=el(`<button class="btn green" ${ready?'':'disabled'}>Закрыть стол</button>`);
    k.onclick=()=>{ delete S.orders[S.activeTable]; S.sheet=null; S.screen='floor'; save(); render(); toast('Стол '+o.table+' закрыт'); };
    acts.append(c,k); sh.appendChild(acts);
  }

  document.body.appendChild(sc);
}

/* live timers: patch text only, never rebuild DOM (не сбивает ввод) */
let lastTick=Date.now();
setInterval(()=>{
  const gap = Date.now()-lastTick; lastTick=Date.now();
  const changed = checkReady();
  if(S.sheet && !changed) return;
  // gap > 20с значит приложение было свернуто — обновляем всё
  if(changed || gap>20000 || S.screen==='floor' || S.screen==='table') render();
},1000);

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){ unlockAudio(); checkReady(); render(); }
});

/* service worker (только на реальном хостинге) */
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

boot();
</script>
</body>
</html>
